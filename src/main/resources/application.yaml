spring:
  application:
    name: croustyquizz
  profiles:
    # Sans profil explicite, on est en développement. La production
    # s'active avec SPRING_PROFILES_ACTIVE=prod.
    default: dev
  flyway:
    # Plusieurs branches créent des migrations en parallèle et ne fusionnent pas dans
    # l'ordre de leurs horodatages : une migration plus ancienne que la dernière appliquée
    # doit passer partout, recette et production comprises (CONTRIBUTING.md, « Base de données »).
    out-of-order: true
  jpa:
    open-in-view: false
    hibernate:
      # Le schéma appartient à Flyway : Hibernate vérifie, il ne crée rien.
      ddl-auto: validate
  web:
    resources:
      cache:
        use-last-modified: true
        cachecontrol:
          no-cache: true
server:
  # Render et Tailscale Funnel terminent le HTTPS puis relaient en HTTP : Tomcat reprend le schéma
  # et l'hôte publics de X-Forwarded-Proto et X-Forwarded-Host, sans quoi le QR code de l'Écran de
  # salle mènerait à une adresse http://. Seuls les relais d'adresse interne (127.0.0.1, réseaux
  # privés) sont crus ; en développement, sans relais, rien ne change. La limite de requêtes s'appuie
  # aussi sur l'adresse du client que Tomcat en tire (X-Forwarded-For), jamais sur l'en-tête brut.
  forward-headers-strategy: native
  servlet:
    session:
      tracking-modes: cookie
      cookie:
        http-only: true
        same-site: lax

croustyquizz:
  tempsreel:
    delai-eviction-vues: 24h
  # Limite de requêtes (#4, #238) : une rafale, puis un jeton regagné à chaque intervalle, par seuil et par clé.
  # Justification de chaque seuil dans ReglagesDesLimites ; réglage dans docs/deploiement.md.
  limites:
    actif: true
    # Par seuil : chacun a sa table. Environ 200 octets par clé : au pire, 12 tables × 20 000 clés font 48 Mo.
    plafond-cles: 20000
    # Par jeton. La Manette attend la réponse avant un nouveau Buzz : 5 par seconde reste hors de portée d'un doigt.
    buzz:
      rafale: 10
      intervalle: 200ms
    # Par jeton et par route (brouillon, Proposition, Vote, Réponse) ; le brouillon part au plus toutes les 500 ms.
    reponses:
      rafale: 20
      intervalle: 100ms
    # Par adresse IP, seuls les codes inconnus (404), comptés après la réponse : le bon code n'est jamais refusé ici.
    codes-inconnus:
      rafale: 20
      intervalle: 3s
    # Par adresse IP, toutes les arrivées : deux salles de 60 Joueurs derrière un même Wi-Fi. Borne aussi le
    # rythme des essais de code d'un script : 20 par minute parmi 10^9 codes, une dizaine d'années pour en trouver un.
    arrivees:
      rafale: 120
      intervalle: 3s
    # Par adresse IP, toutes Soirées confondues : l'Animateur ouvre un ou deux Écrans de salle.
    acces-ecran:
      rafale: 10
      intervalle: 6s
    # Par clé d'Écran : l'Écran de salle ne charge le QR code qu'au changement de code.
    qr-code:
      rafale: 10
      intervalle: 1s
    connexion-adresse:
      rafale: 20
      intervalle: 3s
    connexion-email:
      rafale: 5
      intervalle: 30s
    inscription-adresse:
      rafale: 20
      intervalle: 30s
  manche:
    # Transition du Pilotage Automatique entre deux Manches (#123).
    dureeTransitionSecondes: 15
  passage:
    limitePassagesEnAttente: 1
    delaiAppelSecondes: 30
    dureeVoteSecondes: 30
    dureeAffichageMoyenneSecondes: 10
  karaoke:
    delaiConsultationNavigateurMs: 8000
    delaiConfirmationNavigateurMs: 10000
    urlLrclib: https://lrclib.net
    userAgentLrclib: CroustyQuizz/1.0 (https://github.com/Tibxla/croustyquizz)
    delaiSourceMs: 5000
    tailleReponseSourceMaxOctets: 2097152
    longueurRechercheMax: 120
  blindtest:
    urlDeezer: https://api.deezer.com
    delaiDeezerMs: 5000
    tailleReponseMaxOctets: 2097152
