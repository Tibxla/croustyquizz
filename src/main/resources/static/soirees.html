<!doctype html>
<html lang="fr">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Soirées du Lieu · CroustyQuizz</title>
	<link rel="stylesheet" href="/css/croustyquizz.css">
	<link rel="stylesheet" href="/css/compte.css">
	<script type="module" src="/js/soirees-du-lieu.mjs"></script>
</head>
<body>
	<header class="entete">
		<a class="marque" href="/" aria-label="CroustyQuizz, accueil">Crousty<span class="marque__accent">Quizz</span></a>
		<div data-menu-compte></div>
	</header>

	<main class="compte compte--large">
		<section class="panneau" aria-labelledby="titre">
			<div class="soirees__entete">
				<h1 id="titre">Soirées du Lieu</h1>
				<a class="bouton bouton--action" href="/preparer-soiree.html"><span class="icone icone--ajouter" aria-hidden="true"></span>Préparer une Soirée</a>
			</div>
			<p class="envoi envoi--accepte" role="status" data-lieu-cree hidden><span class="icone icone--ok" aria-hidden="true"></span>Ton Lieu est créé.</p>
			<p class="envoi" role="status" data-statut-soirees>Chargement des Soirées…</p>
			<div class="soirees" data-soirees aria-busy="true"></div>
			<noscript>Active JavaScript pour voir les Soirées du Lieu.</noscript>
		</section>
	</main>
</body>
</html>
