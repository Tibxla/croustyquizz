<!doctype html>
<html lang="fr">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Rejoindre un Lieu · CroustyQuizz</title>
	<link rel="stylesheet" href="/css/croustyquizz.css">
	<link rel="stylesheet" href="/css/compte.css">
	<script type="module" src="/js/invitation.mjs"></script>
</head>
<body>
	<main class="compte">
		<header><span class="marque">Crousty<span class="marque__accent">Quizz</span></span></header>
		<section class="panneau" aria-labelledby="titre" data-invitation-invite>
			<h1 id="titre">Rejoindre un Lieu</h1>
			<p role="status" tabindex="-1"></p>
			<button type="button" class="bouton" data-deconnexion hidden>Se déconnecter</button>
			<form class="compte__formulaire" method="post" novalidate hidden>
				<div class="champ">
					<label for="email">E-mail de l’invitation</label>
					<input id="email" name="email" type="email" autocomplete="username" readonly aria-describedby="email-erreur">
					<p id="email-erreur" class="champ--erreur" hidden></p>
				</div>
				<div class="champ">
					<label for="nom">Ton nom</label>
					<input id="nom" name="nom" autocomplete="name" required aria-describedby="nom-erreur">
					<p id="nom-erreur" class="champ--erreur" hidden></p>
				</div>
				<div class="champ">
					<label for="mot-de-passe">Mot de passe</label>
					<input id="mot-de-passe" name="motDePasse" type="password" autocomplete="new-password" required
						aria-describedby="mot-de-passe-aide mot-de-passe-erreur">
					<p id="mot-de-passe-aide" class="champ__aide">De 12 à 128 caractères.</p>
					<p id="mot-de-passe-erreur" class="champ--erreur" hidden></p>
				</div>
				<p class="champ--erreur" role="alert" hidden></p>
				<button class="bouton bouton--action" type="submit">Rejoindre le Lieu</button>
			</form>
			<noscript>Active JavaScript pour ouvrir cette invitation.</noscript>
		</section>
		<p class="compte__navigation">Tu as déjà un compte ? <a href="/connexion.html">Te connecter</a></p>
	</main>
</body>
</html>
