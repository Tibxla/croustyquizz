<!doctype html>
<html lang="fr">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>CroustyQuizz</title>
	<style>
		:root {
			--fond: #14111f;
			--carte: #1f1a30;
			--texte: #f4f1fa;
			--doux: #a9a2bd;
			--accent: #ffb547;
		}
		* { box-sizing: border-box; }
		body {
			margin: 0;
			min-height: 100vh;
			display: grid;
			place-items: center;
			padding: 24px 16px;
			background: var(--fond);
			color: var(--texte);
			font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
		}
		main { width: min(720px, 100%); }
		h1 { font-size: clamp(2.2rem, 8vw, 3.5rem); margin: 0 0 8px; letter-spacing: -0.02em; }
		h1 span { color: var(--accent); }
		p { color: var(--doux); line-height: 1.5; margin: 0 0 32px; }
		ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
		li { background: var(--carte); border-radius: 12px; padding: 20px; }
		li strong { display: block; margin-bottom: 6px; }
		li small { color: var(--doux); }
	</style>
</head>
<body>
	<main>
		<h1>Crousty<span>Quizz</span></h1>
		<p>Les soirées de votre bar, jouées depuis le téléphone de chaque client.</p>
		<ul>
			<li><strong>Quiz</strong><small>Répondez plus vite que la salle.</small></li>
			<li><strong>Blind test</strong><small>Buzzez dès les premières notes.</small></li>
			<li><strong>Karaoké</strong><small>Chantez, la salle vote.</small></li>
		</ul>
	</main>
</body>
</html>
