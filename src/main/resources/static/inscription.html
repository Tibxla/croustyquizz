<!doctype html>
<html lang="fr">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Créer le compte du Lieu · CroustyQuizz</title>
	<link rel="stylesheet" href="/css/croustyquizz.css">
	<link rel="stylesheet" href="/css/compte.css">
	<script type="module" src="/js/formulaire-compte.mjs"></script>
</head>
<body>
	<main class="compte">
		<header><span class="marque">Crousty<span class="marque__accent">Quizz</span></span></header>
		<section class="panneau" aria-labelledby="titre">
			<h1 id="titre">Créer le compte du Lieu</h1>
			<form class="compte__formulaire" data-compte="inscription" method="post" novalidate>
				<fieldset>
					<legend>Ton Lieu</legend>
					<div class="champ">
						<label for="lieu">Nom du Lieu</label>
						<input id="lieu" name="lieuNom" autocomplete="organization" required aria-describedby="lieu-erreur">
						<p id="lieu-erreur" class="champ--erreur" hidden></p>
					</div>
					<div class="champ">
						<label for="ville">Ville</label>
						<input id="ville" name="ville" autocomplete="address-level2" required aria-describedby="ville-erreur">
						<p id="ville-erreur" class="champ--erreur" hidden></p>
					</div>
				</fieldset>
				<div class="champ">
					<label for="nom">Ton nom</label>
					<input id="nom" name="nom" autocomplete="name" required aria-describedby="nom-erreur">
					<p id="nom-erreur" class="champ--erreur" hidden></p>
				</div>
				<div class="champ">
					<label for="email">Ton e-mail</label>
					<input id="email" name="email" type="email" autocomplete="username" required aria-describedby="email-erreur">
					<p id="email-erreur" class="champ--erreur" hidden></p>
				</div>
				<div class="champ">
					<label for="mot-de-passe">Mot de passe</label>
					<input id="mot-de-passe" name="motDePasse" type="password" autocomplete="new-password" required
						aria-describedby="mot-de-passe-aide mot-de-passe-erreur">
					<p id="mot-de-passe-aide" class="champ__aide">De 12 à 128 caractères.</p>
					<p id="mot-de-passe-erreur" class="champ--erreur" hidden></p>
				</div>
				<p class="champ--erreur" role="alert" hidden></p>
				<button class="bouton bouton--action" type="submit">Créer le compte</button>
			</form>
			<noscript>Active JavaScript pour créer ton compte.</noscript>
		</section>
		<p class="compte__navigation">Tu as déjà un compte ? <a data-autre-page href="/connexion.html">Te connecter</a></p>
	</main>
</body>
</html>
