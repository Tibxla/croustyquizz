<!doctype html>
<html lang="fr">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Connexion · CroustyQuizz</title>
	<link rel="stylesheet" href="/css/croustyquizz.css">
	<link rel="stylesheet" href="/css/compte.css">
	<script type="module" src="/js/formulaire-compte.mjs"></script>
</head>
<body>
	<header class="entete entete--seule"><a class="marque" href="/" aria-label="CroustyQuizz, accueil">Crousty<span class="marque__accent">Quizz</span></a></header>

	<main class="compte">
		<section class="panneau" aria-labelledby="titre">
			<h1 id="titre">Connexion à la Console</h1>
			<p class="compte__intro">Pour préparer et animer les Soirées de ton Lieu.</p>
			<form class="compte__formulaire" data-compte="connexion" method="post" novalidate>
				<div class="champ">
					<label for="email">Ton e-mail</label>
					<input id="email" name="email" type="email" autocomplete="username" required aria-describedby="email-erreur">
					<p id="email-erreur" class="champ--erreur" hidden></p>
				</div>
				<div class="champ">
					<label for="mot-de-passe">Mot de passe</label>
					<input id="mot-de-passe" name="motDePasse" type="password" autocomplete="current-password" required
						aria-describedby="mot-de-passe-erreur">
					<p id="mot-de-passe-erreur" class="champ--erreur" hidden></p>
				</div>
				<p class="champ--erreur" role="alert" hidden></p>
				<button class="bouton bouton--action" type="submit">Se connecter</button>
			</form>
			<noscript>Active JavaScript pour te connecter.</noscript>
		</section>
		<nav class="compte__navigation" aria-label="Autres accès">
			<p>Pas encore de compte pour ton Lieu ? <a data-autre-page href="/inscription.html">Créer un compte</a></p>
			<p>Tu viens jouer ? Pas besoin de compte : <a href="/rejoindre.html">Rejoindre une Soirée</a></p>
		</nav>
	</main>
</body>
</html>
