<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manette · CroustyQuizz</title>
  <link rel="stylesheet" href="/css/croustyquizz.css">
  <link rel="stylesheet" href="/css/manette.css">
  <link rel="stylesheet" href="/css/photos.css">
  <script defer src="/webjars/stomp__stompjs/bundles/stomp.umd.min.js"></script>
  <script type="module" src="/js/page.mjs"></script>
</head>
<body data-ecran="manette">
<main class="manette">
  <header class="manette__entete">
    <span class="marque">Crousty<span class="marque__accent">Quizz</span></span>
    <span class="manette__pseudo" data-pseudo></span>
    <p class="connexion" role="status" data-connexion>Connexion…</p>
    <button type="button" class="bouton manette__menu-bouton" data-menu-bouton><span class="icone icone--menu" aria-hidden="true"></span>Menu</button>
  </header>
  <div class="menu menu--manette" id="menu-manette" data-menu hidden>
    <h1 class="menu__titre" data-titre>Soirée</h1>
    <details class="replie"><summary data-nombre-joueurs>Joueurs</summary><ul class="commun__liste" data-joueurs></ul></details>
    <details class="replie"><summary>Classement général</summary><ol class="commun__liste" data-classement></ol></details>
    <section class="photos--manette" data-photos aria-label="Photo de la salle" hidden></section>
    <button type="button" class="bouton" data-reprise disabled><span class="icone icone--resynchroniser" aria-hidden="true"></span>Resynchroniser</button>
  </div>
  <p class="commun__personnel" data-personnel hidden></p>
  <section class="coquille__mode" data-principale aria-label="Mode de jeu"></section>
  <p class="manette__aide" data-attente>La prochaine Manche s’affichera ici.</p>
  <p class="envoi envoi--refuse" role="alert" data-erreur hidden></p>
  <div class="manette__actions">
    <p class="envoi" role="status" data-envoi hidden></p>
    <p class="manette__buzz" data-buzz hidden></p>
    <button type="button" class="bouton bouton--action bouton--grand" data-buzzer hidden disabled>Buzzer</button>
  </div>
  <noscript>Active JavaScript dans ton navigateur pour suivre la Soirée.</noscript>
</main>
</body>
</html>
