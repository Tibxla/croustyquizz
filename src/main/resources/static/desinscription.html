<!doctype html>
<html lang="fr">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="referrer" content="no-referrer">
	<title>Désinscription des offres SMS · CroustyQuizz</title>
	<link rel="stylesheet" href="/css/croustyquizz.css">
	<link rel="stylesheet" href="/css/compte.css">
	<script type="module" src="/js/desinscription.mjs"></script>
</head>
<body>
	<header class="entete">
		<a class="marque" href="/" aria-label="CroustyQuizz, accueil">Crousty<span class="marque__accent">Quizz</span></a>
	</header>
	<main class="compte" data-desinscription>
		<section class="panneau" aria-labelledby="titre">
			<h1 id="titre">Désinscription des offres SMS</h1>
			<p class="compte__intro" data-aide-desinscription hidden>Confirme pour ne plus recevoir les offres de ce Lieu par SMS.</p>
			<button class="bouton bouton--action" type="button" hidden>Me désinscrire</button>
			<p role="status" tabindex="-1"></p>
			<noscript>Active JavaScript pour confirmer ta désinscription.</noscript>
		</section>
	</main>
</body>
</html>
