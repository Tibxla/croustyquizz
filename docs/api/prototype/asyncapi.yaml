asyncapi: 3.1.0
info:
  title: Diffusion technique de démonstration CroustyQuizz
  version: 0.1.0
  description: >-
    Prototype sans authentification ni capture révisée. Les événements métier de
    ../asyncapi.yaml seront ajoutés avec les accès et les projections du Quiz.
servers:
  local:
    host: localhost:8080
    pathname: /ws
    protocol: ws
    description: STOMP 1.2. CONNECT, SUBSCRIBE et UNSUBSCRIBE autorisés, SEND refusé.
channels:
  salle:
    address: /topic/soirees/{soireeId}/salle
    parameters:
      soireeId:
        description: UUID arbitraire de la démonstration.
    messages:
      buzz:
        $ref: '#/components/messages/Buzz'
operations:
  diffuserBuzz:
    action: send
    channel:
      $ref: '#/channels/salle'
    messages:
      - $ref: '#/channels/salle/messages/buzz'
components:
  messages:
    Buzz:
      payload:
        type: object
        required: [type, donnees]
        additionalProperties: false
        properties:
          type: {type: string, const: buzz-recu}
          donnees:
            type: object
            required: [pseudo, recuLe]
            additionalProperties: false
            properties:
              pseudo: {type: string, minLength: 1, maxLength: 30}
              recuLe: {type: string, format: date-time}
