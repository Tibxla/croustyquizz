openapi: 3.1.0
info:
  title: Socle technique de démonstration CroustyQuizz
  version: 0.1.0
  description: >-
    Routes de test sans authentification, actives en profil dev seulement (sauf heure).
    Aucun Joueur, aucune Soirée et aucune Manche ne sont créés.
    Le contrat métier authentifié reste dans ../openapi.yaml.
servers:
  - url: http://localhost:8080
paths:
  /api/heure:
    get:
      operationId: consulterHeure
      responses:
        '200':
          description: Heure du serveur, sans garantie d'installation d'un abonnement.
          content:
            application/json:
              schema:
                type: object
                required: [maintenant]
                properties:
                  maintenant: {type: string, format: date-time}
  /api/test/soirees/{soireeId}/canaux:
    parameters:
      - $ref: '#/components/parameters/SoireeId'
    get:
      operationId: consulterCanauxDeTest
      responses:
        '200':
          description: Destinations dérivées des constantes du serveur.
          content:
            application/json:
              schema:
                type: object
                required: [connexion, salle, console, buzz]
                properties:
                  connexion: {type: string, const: /ws}
                  salle: {type: string}
                  console: {type: string}
                  buzz: {type: string}
        '400': {description: UUID invalide.}
  /api/test/soirees/{soireeId}/buzz:
    parameters:
      - $ref: '#/components/parameters/SoireeId'
    post:
      operationId: buzzerDansLePrototype
      description: >-
        Pseudo fourni par la page, sans identité authentifiée. Espaces retirés aux
        extrémités, puis limite à 30 points de code Unicode sans couper un caractère.
        Horodatage et diffusion sérialisés par Soirée dans cette instance du serveur.
        Pas de déduplication ni de classement métier.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pseudo]
              properties:
                pseudo: {type: string, minLength: 1}
      responses:
        '200':
          description: Buzz diffusé ; un seul événement par appel accepté.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuzzRecu'
        '400': {description: "JSON ou UUID invalide, pseudo absent ou blanc."}
components:
  parameters:
    SoireeId:
      name: soireeId
      in: path
      required: true
      schema: {type: string, format: uuid}
  schemas:
    BuzzRecu:
      type: object
      required: [pseudo, recuLe]
      additionalProperties: false
      properties:
        pseudo: {type: string, minLength: 1, maxLength: 30}
        recuLe: {type: string, format: date-time}
