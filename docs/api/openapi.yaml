components:
  securitySchemes:
    sessionAnimateur:
      type: apiKey
      in: cookie
      name: JSESSIONID
      description: Session d’un Animateur ; opérations mutantes protégées par X-CSRF-TOKEN. Le Lieu est déterminé
        par la session.
    jetonJoueur:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Jeton de reconnexion opaque remis au Joueur ; le serveur en déduit son identité et sa Soirée.
    cleEcran:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Capacité de lecture seule limitée à une Soirée, créée par un Animateur ; aucune commande ni vue
        privée.
  responses:
    Erreur400:
      description: JSON, paramètre ou identifiant mal formé.
      headers:
        Cache-Control:
          description: Toujours no-store, notamment pour les secrets, vues et corrections.
          schema:
            type: string
            const: no-store
      content:
        application/problem+json:
          schema:
            $ref: ./schemas.yaml#/$defs/Probleme
    Erreur401:
      description: Identité absente, invalide ou expirée.
      headers:
        Cache-Control:
          description: Toujours no-store, notamment pour les secrets, vues et corrections.
          schema:
            type: string
            const: no-store
      content:
        application/problem+json:
          schema:
            $ref: ./schemas.yaml#/$defs/Probleme
    Erreur403:
      description: CSRF invalide ou action non autorisée.
      headers:
        Cache-Control:
          description: Toujours no-store, notamment pour les secrets, vues et corrections.
          schema:
            type: string
            const: no-store
      content:
        application/problem+json:
          schema:
            $ref: ./schemas.yaml#/$defs/Probleme
    Erreur404:
      description: Ressource inconnue ou hors du Lieu/de la Soirée autorisés.
      headers:
        Cache-Control:
          description: Toujours no-store, notamment pour les secrets, vues et corrections.
          schema:
            type: string
            const: no-store
      content:
        application/problem+json:
          schema:
            $ref: ./schemas.yaml#/$defs/Probleme
    Erreur409:
      description: Conflit avec l’état courant, l’unicité ou l’idempotence.
      headers:
        Cache-Control:
          description: Toujours no-store, notamment pour les secrets, vues et corrections.
          schema:
            type: string
            const: no-store
      content:
        application/problem+json:
          schema:
            $ref: ./schemas.yaml#/$defs/Probleme
    Erreur422:
      description: Données ne respectant pas le contrat.
      headers:
        Cache-Control:
          description: Toujours no-store, notamment pour les secrets, vues et corrections.
          schema:
            type: string
            const: no-store
      content:
        application/problem+json:
          schema:
            $ref: ./schemas.yaml#/$defs/Probleme
