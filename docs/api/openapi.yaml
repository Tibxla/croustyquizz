      description: 'Manche Karaoké active en Soirée EN_COURS. Écran de salle. La fenêtre qui vient de choisir son
        dossier se désigne par un lecteurId qu’elle a engendré ; la dernière désignation l’emporte, un seul
        lecteur par Manche. La fenêtre garde son dossier et se redésigne à la Manche Karaoké suivante.
        Pendant l’appel, la désignation efface la lecture préparée par un autre lecteur ; jamais celle d’un
        Passage démarré, dont les signaux restent réservés à son lecteur. Publie lecture-chanson-modifiee
        sur la salle et la Console. Aucun code propre : le lecteur déjà désigné réussit sans effet ni
        publication. Refus communs : 400 REQUETE_INVALIDE, 401 AUTHENTIFICATION_REQUISE, 403 ACCES_REFUSE,
        404 RESSOURCE_INTROUVABLE (Manche ou Passage inconnus, hors portée), 409 ENVOI_REUTILISE, 409
        ETAPE_INACTIVE (sans reçu), 409 ETAT_INCOMPATIBLE (Manche terminée), 503 SERVICE_INDISPONIBLE (sans
        reçu). Ordre : accès puis état de la Manche (pause comprise). Reçu et rejeu :
