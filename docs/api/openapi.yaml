openapi: 3.1.0
info:
  title: CroustyQuizz — contrats Quiz et File d’attente du Karaoké
  version: 0.1.0
  description: 'Contrat cible à relire (#34, #82), pas une déclaration d’endpoints déjà déployés.
    Format Solo, Pilotage Manuel, Quiz et File d’attente du Karaoké ; socle de Buzz inclus.
    README.md fait partie du contrat.'
servers:
- url: http://localhost:8080
  description: Développement local
- url: https://{hote}
  description: Hébergement HTTPS à configurer
  variables:
    hote:
      default: croustyquizz.example
tags:
- name: Accès
- name: Soirée
- name: Quiz
- name: Socle
- name: Karaoké
paths:
  /api/csrf:
    get:
      operationId: obtenirCsrf
      summary: Obtenir le jeton CSRF de la session navigateur
      description: Accessible avant connexion. Peut créer une session anonyme et son cookie JSESSIONID. Le jeton
        reste dans le navigateur ; ne jamais le publier dans un événement.
      tags:
      - Accès
      security: []
      responses:
        '200':
          description: Opération réussie.
          headers:
            Cache-Control:
              description: Toujours no-store, notamment pour les secrets, vues et corrections.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: ./schemas.yaml#/$defs/Csrf
  /api/animateurs:
    post:
      operationId: inscrireAnimateur
      summary: Créer un Lieu et son premier Animateur
      description: 'Inscription initiale atomique ; ne rattache jamais à un Lieu existant fourni par le visiteur.
        Le mot de passe est haché côté serveur et absent des réponses. L’invitation d’autres Animateurs relève d’une
        extension de #5.'
      tags:
      - Accès
      security: []
      responses:
        '201':
          description: Opération réussie.
          headers:
            Cache-Control:
              description: Toujours no-store, notamment pour les secrets, vues et corrections.
              schema:
                type: string
                const: no-store
            Location:
              description: URI de la ressource créée, sans secret.
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: ./schemas.yaml#/$defs/CompteCree
        '400':
          $ref: '#/components/responses/Erreur400'
        '403':
          $ref: '#/components/responses/Erreur403'
        '409':
          $ref: '#/components/responses/Erreur409'
        '422':
          $ref: '#/components/responses/Erreur422'
      parameters:
      - name: X-CSRF-TOKEN
        in: header
        required: true
        description: Jeton obtenu par GET /api/csrf dans cette session ; renouveler après connexion/déconnexion.
        schema:
          type: string
          minLength: 16
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/$defs/InscriptionAnimateur
  /api/animateurs/session:
    post:
      operationId: connecterAnimateur
      summary: Connecter un Animateur
      description: 'Crée ou renouvelle la session JSESSIONID ; le navigateur conserve le cookie HttpOnly, SameSite=Lax,
        Secure en HTTPS. Récupérer un nouveau CSRF après connexion. Identifiants refusés : 401 IDENTIFIANTS_INVALIDES,
        sans distinguer e-mail et mot de passe.'
      tags:
      - Accès
      security: []
      responses:
        '200':
          description: Opération réussie.
          headers:
            Cache-Control:
              description: Toujours no-store, notamment pour les secrets, vues et corrections.
              schema:
                type: string
                const: no-store
            Set-Cookie:
              description: JSESSIONID renouvelé ; HttpOnly ; SameSite=Lax ; Secure en HTTPS.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: ./schemas.yaml#/$defs/Animateur
        '400':
          $ref: '#/components/responses/Erreur400'
        '401':
          $ref: '#/components/responses/Erreur401'
        '403':
          $ref: '#/components/responses/Erreur403'
        '422':
          $ref: '#/components/responses/Erreur422'
      parameters:
      - name: X-CSRF-TOKEN
        in: header
        required: true
        description: Jeton obtenu par GET /api/csrf dans cette session ; renouveler après connexion/déconnexion.
        schema:
          type: string
          minLength: 16
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/$defs/ConnexionAnimateur
    get:
      operationId: consulterAnimateur
      summary: Consulter son identité Animateur
      description: Consulter son identité Animateur
      tags:
      - Accès
      security:
      - sessionAnimateur: []
      responses:
        '200':
          description: Opération réussie.
          headers:
            Cache-Control:
              description: Toujours no-store, notamment pour les secrets, vues et corrections.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: ./schemas.yaml#/$defs/Animateur
        '401':
          $ref: '#/components/responses/Erreur401'
    delete:
      operationId: deconnecterAnimateur
      summary: Fermer la session Animateur
      description: Invalide la session et ferme ses connexions STOMP ; récupérer un nouveau CSRF avant une nouvelle
        connexion.
      tags:
      - Accès
      security:
      - sessionAnimateur: []
      responses:
        '204':
          description: Opération réussie.
          headers:
            Cache-Control:
              description: Toujours no-store, notamment pour les secrets, vues et corrections.
              schema:
                type: string
                const: no-store
        '401':
          $ref: '#/components/responses/Erreur401'
        '403':
          $ref: '#/components/responses/Erreur403'
      parameters:
      - name: X-CSRF-TOKEN
        in: header
        required: true
        description: Jeton obtenu par GET /api/csrf dans cette session ; renouveler après connexion/déconnexion.
        schema:
          type: string
          minLength: 16
  /api/heure:
    get:
      operationId: consulterHeure
      summary: Consulter l’heure du serveur
      description: Consulter l’heure du serveur
      tags:
      - Socle
      security: []
      responses:
        '200':
          description: Opération réussie.
          headers:
            Cache-Control:
              description: Toujours no-store, notamment pour les secrets, vues et corrections.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: ./schemas.yaml#/$defs/Heure
  /api/soirees:
    get:
      operationId: listerSoirees
      summary: Lister les Soirées de son Lieu
      description: Comprend les Soirées préparées, en cours et terminées de ce Lieu exclusivement.
      tags:
      - Soirée
      security:
      - sessionAnimateur: []
      responses:
        '200':
          description: Opération réussie.
          headers:
            Cache-Control:
              description: Toujours no-store, notamment pour les secrets, vues et corrections.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: ./schemas.yaml#/$defs/ListeSoirees
        '401':
          $ref: '#/components/responses/Erreur401'
    post:
      operationId: creerSoiree
      summary: Créer une Soirée Solo en Pilotage Manuel
      description: Le serveur affecte id, Lieu et état PREPARATION ; codeAcces est null jusqu’à ouverture. Les autres
        Formats et Pilotages seront ajoutés ultérieurement.
      tags:
      - Soirée
      security:
      - sessionAnimateur: []
      responses:
        '201':
          description: Opération réussie.
          headers:
            Cache-Control:
              description: Toujours no-store, notamment pour les secrets, vues et corrections.
              schema:
                type: string
                const: no-store
            Location:
              description: URI de la ressource créée, sans secret.
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: ./schemas.yaml#/$defs/Soiree
        '400':
          $ref: '#/components/responses/Erreur400'
        '401':
          $ref: '#/components/responses/Erreur401'
        '403':
          $ref: '#/components/responses/Erreur403'
        '404':
          $ref: '#/components/responses/Erreur404'
        '409':
          $ref: '#/components/responses/Erreur409'
        '422':
          $ref: '#/components/responses/Erreur422'
      parameters:
      - name: X-CSRF-TOKEN
        in: header
        required: true
        description: Jeton obtenu par GET /api/csrf dans cette session ; renouveler après connexion/déconnexion.
        schema:
          type: string
          minLength: 16
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/$defs/CreationSoiree
  /api/soirees/{soireeId}:
    get:
      operationId: consulterSoiree
      summary: Consulter une Soirée de son Lieu
      description: Consulter une Soirée de son Lieu
      tags:
      - Soirée
      security:
      - sessionAnimateur: []
      responses:
        '200':
          description: Opération réussie.
          headers:
            Cache-Control:
              description: Toujours no-store, notamment pour les secrets, vues et corrections.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: ./schemas.yaml#/$defs/Soiree
        '400':
          $ref: '#/components/responses/Erreur400'
        '401':
          $ref: '#/components/responses/Erreur401'
        '403':
          $ref: '#/components/responses/Erreur403'
        '404':
          $ref: '#/components/responses/Erreur404'
        '409':
          $ref: '#/components/responses/Erreur409'
        '422':
          $ref: '#/components/responses/Erreur422'
      parameters:
      - name: soireeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: modifierSoiree
      summary: Modifier le titre avant lancement
      description: Autorisé en PREPARATION et OUVERTE ; programme et réglages ne sont plus modifiables en EN_COURS
        ou TERMINEE.
      tags:
      - Soirée
      security:
      - sessionAnimateur: []
      responses:
        '200':
          description: Opération réussie.
          headers:
            Cache-Control:
              description: Toujours no-store, notamment pour les secrets, vues et corrections.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: ./schemas.yaml#/$defs/Soiree
        '400':
          $ref: '#/components/responses/Erreur400'
        '401':
          $ref: '#/components/responses/Erreur401'
        '403':
          $ref: '#/components/responses/Erreur403'
        '404':
          $ref: '#/components/responses/Erreur404'
        '409':
          $ref: '#/components/responses/Erreur409'
        '422':
          $ref: '#/components/responses/Erreur422'
      parameters:
      - name: soireeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: X-CSRF-TOKEN
        in: header
        required: true
        description: Jeton obtenu par GET /api/csrf dans cette session ; renouveler après connexion/déconnexion.
        schema:
          type: string
          minLength: 16
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/$defs/ModificationSoiree
  /api/soirees/rejoindre:
    post:
      operationId: rejoindreSoiree
      summary: Rejoindre une Soirée avec un code et un pseudo
      description: Autorisé en OUVERTE ou EN_COURS. Pseudo nettoyé, filtré et unique dans la Soirée ; le serveur
        attribue l’identité et un jeton opaque. Un Joueur qui arrive pendant une Manche y joue aussitôt (#10). Stocker le jeton
        pour la reconnexion. Sans identité ni heure fournies par la Manette.
      tags:
      - Soirée
      security: []
      responses:
        '201':
          description: Opération réussie.
          headers:
            Cache-Control:
              description: Toujours no-store, notamment pour les secrets, vues et corrections.
              schema:
                type: string
                const: no-store
            Location:
              description: URI de la ressource créée, sans secret.
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: ./schemas.yaml#/$defs/AccesJoueur
        '400':
          $ref: '#/components/responses/Erreur400'
        '404':
          $ref: '#/components/responses/Erreur404'
        '409':
          $ref: '#/components/responses/Erreur409'
        '422':
          $ref: '#/components/responses/Erreur422'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/$defs/Rejoindre
  /api/soirees/{soireeId}/acces-ecran:
    post:
      operationId: creerAccesEcran
      summary: Créer un accès de lecture pour l’Écran de salle
      description: L’Animateur ouvre l’Écran de salle avec cette capacité limitée à sa Soirée. La clé expire à expireLe
        ; ne donne accès ni à la Console ni aux vues privées. Préférer un transfert par fragment URL, retirer ce
        fragment après lecture et ne jamais inscrire la clé dans une chaîne de requête.
      tags:
      - Soirée
      security:
      - sessionAnimateur: []
      responses:
        '200':
          description: Opération réussie.
          headers:
            Cache-Control:
              description: Toujours no-store, notamment pour les secrets, vues et corrections.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: ./schemas.yaml#/$defs/AccesEcran
        '400':
          $ref: '#/components/responses/Erreur400'
        '401':
          $ref: '#/components/responses/Erreur401'
        '403':
          $ref: '#/components/responses/Erreur403'
        '404':
          $ref: '#/components/responses/Erreur404'
        '409':
          $ref: '#/components/responses/Erreur409'
        '422':
          $ref: '#/components/responses/Erreur422'
      parameters:
      - name: soireeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: X-CSRF-TOKEN
        in: header
        required: true
        description: Jeton obtenu par GET /api/csrf dans cette session ; renouveler après connexion/déconnexion.
        schema:
          type: string
          minLength: 16
  /api/soirees/{soireeId}/manches:
    post:
      operationId: ajouterManche
      summary: Ajouter une Manche de Quiz ou de Karaoké
      description: PREPARATION ou OUVERTE uniquement ; le serveur affecte l’ordre final. KARAOKE résout la
        limite initiale configurée si elle est absente ; aucun Idempotency-Key ajouté à cette route.
      tags:
      - Soirée
      security:
      - sessionAnimateur: []
      responses:
        '201':
          description: Opération réussie.
          headers:
            Cache-Control:
              description: Toujours no-store, notamment pour les secrets, vues et corrections.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: ./schemas.yaml#/$defs/Manche
        '400':
          $ref: '#/components/responses/Erreur400'
        '401':
          $ref: '#/components/responses/Erreur401'
        '403':
          $ref: '#/components/responses/Erreur403'
        '404':
          $ref: '#/components/responses/Erreur404'
        '409':
          $ref: '#/components/responses/Erreur409'
        '422':
          $ref: '#/components/responses/Erreur422'
      parameters:
      - name: soireeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: X-CSRF-TOKEN
        in: header
        required: true
        description: Jeton obtenu par GET /api/csrf dans cette session ; renouveler après connexion/déconnexion.
        schema:
          type: string
          minLength: 16
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/$defs/CreationManche
  /api/soirees/{soireeId}/manches/{mancheId}:
    delete:
      operationId: retirerManche
      summary: Retirer une Manche avant lancement
      description: PREPARATION ou OUVERTE ; la Manche doit appartenir à la Soirée de ce Lieu. Le serveur réindexe
        les positions.
      tags:
      - Soirée
      security:
      - sessionAnimateur: []
      responses:
        '204':
          description: Opération réussie.
          headers:
            Cache-Control:
              description: Toujours no-store, notamment pour les secrets, vues et corrections.
              schema:
                type: string
                const: no-store
        '400':
          $ref: '#/components/responses/Erreur400'
        '401':
          $ref: '#/components/responses/Erreur401'
        '403':
          $ref: '#/components/responses/Erreur403'
        '404':
          $ref: '#/components/responses/Erreur404'
        '409':
          $ref: '#/components/responses/Erreur409'
        '422':
          $ref: '#/components/responses/Erreur422'
      parameters:
      - name: mancheId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: soireeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: X-CSRF-TOKEN
        in: header
        required: true
        description: Jeton obtenu par GET /api/csrf dans cette session ; renouveler après connexion/déconnexion.
        schema:
          type: string
          minLength: 16
  /api/soirees/{soireeId}/ordre-des-manches:
    put:
      operationId: ordonnerManches
      summary: Réordonner le programme
      description: PREPARATION ou OUVERTE. La liste doit être une permutation exacte des Manches existantes ; refus
        atomique en cas de doublon, omission ou identifiant étranger.
      tags:
      - Soirée
      security:
      - sessionAnimateur: []
      responses:
        '200':
          description: Opération réussie.
          headers:
            Cache-Control:
              description: Toujours no-store, notamment pour les secrets, vues et corrections.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: ./schemas.yaml#/$defs/EtatConsole
        '400':
          $ref: '#/components/responses/Erreur400'
        '401':
          $ref: '#/components/responses/Erreur401'
        '403':
          $ref: '#/components/responses/Erreur403'
        '404':
          $ref: '#/components/responses/Erreur404'
        '409':
          $ref: '#/components/responses/Erreur409'
        '422':
          $ref: '#/components/responses/Erreur422'
      parameters:
      - name: soireeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: X-CSRF-TOKEN
        in: header
        required: true
        description: Jeton obtenu par GET /api/csrf dans cette session ; renouveler après connexion/déconnexion.
        schema:
          type: string
          minLength: 16
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/$defs/OrdreManches
  /api/soirees/{soireeId}/manches/{mancheId}/questions:
    put:
      operationId: preparerQuestions
      summary: Remplacer les Questions de la Manche
      description: PREPARATION ou OUVERTE. Remplacement atomique et ordonné. Le serveur crée les identifiants et
        conserve une seule proposition juste. Source ANIMATEUR ; pas de même Question répétée dans la Soirée. Le
        nombre doit correspondre aux réglages pour permettre le lancement.
      tags:
      - Quiz
      security:
      - sessionAnimateur: []
      responses:
        '200':
          description: Opération réussie.
          headers:
            Cache-Control:
              description: Toujours no-store, notamment pour les secrets, vues et corrections.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: ./schemas.yaml#/$defs/QuestionsPreparees
        '400':
          $ref: '#/components/responses/Erreur400'
        '401':
          $ref: '#/components/responses/Erreur401'
        '403':
          $ref: '#/components/responses/Erreur403'
        '404':
          $ref: '#/components/responses/Erreur404'
        '409':
          $ref: '#/components/responses/Erreur409'
        '422':
          $ref: '#/components/responses/Erreur422'
      parameters:
      - name: mancheId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: soireeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: X-CSRF-TOKEN
        in: header
        required: true
        description: Jeton obtenu par GET /api/csrf dans cette session ; renouveler après connexion/déconnexion.
        schema:
          type: string
          minLength: 16
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/$defs/QuestionsSaisies
    get:
      operationId: consulterQuestionsPreparees
      summary: Relire les Questions et leurs solutions
      description: Vue privée réservée à un Animateur du Lieu. Aucune de ces structures ne doit être diffusée à
        la salle ou aux Joueurs avant correction.
      tags:
      - Quiz
      security:
      - sessionAnimateur: []
      responses:
        '200':
          description: Opération réussie.
          headers:
            Cache-Control:
              description: Toujours no-store, notamment pour les secrets, vues et corrections.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: ./schemas.yaml#/$defs/QuestionsPreparees
        '400':
          $ref: '#/components/responses/Erreur400'
        '401':
          $ref: '#/components/responses/Erreur401'
        '403':
          $ref: '#/components/responses/Erreur403'
        '404':
          $ref: '#/components/responses/Erreur404'
        '409':
          $ref: '#/components/responses/Erreur409'
        '422':
          $ref: '#/components/responses/Erreur422'
      parameters:
      - name: mancheId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: soireeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /api/soirees/{soireeId}/ouverture:
    post:
      operationId: ouvrirSoiree
      summary: Ouvrir la Soirée aux Joueurs
      description: PREPARATION vers OUVERTE ; le serveur génère un code de 6 caractères unique parmi les Soirées
        accessibles (OUVERTE et EN_COURS). Le programme peut être complété pendant l’accueil. La clé d’envoi garantit
        qu’une répétition ne régénère pas le code.
      tags:
      - Soirée
      security:
      - sessionAnimateur: []
      responses:
        '200':
          description: Opération réussie.
          headers:
            Cache-Control:
              description: Toujours no-store, notamment pour les secrets, vues et corrections.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: ./schemas.yaml#/$defs/Soiree
        '400':
          $ref: '#/components/responses/Erreur400'
        '401':
          $ref: '#/components/responses/Erreur401'
        '403':
          $ref: '#/components/responses/Erreur403'
        '404':
          $ref: '#/components/responses/Erreur404'
        '409':
          $ref: '#/components/responses/Erreur409'
        '422':
          $ref: '#/components/responses/Erreur422'
        '503':
          $ref: '#/components/responses/Erreur503'
      parameters:
      - name: soireeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        required: true
