        Refus (groupes N, V, T, S) : 400 REQUETE_INVALIDE, 401 AUTHENTIFICATION_REQUISE, 403
        ACCES_REFUSE, 404 RESSOURCE_INTROUVABLE, 409 ETAPE_INACTIVE, 503 SERVICE_INDISPONIBLE, 503
