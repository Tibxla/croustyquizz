      description: 'Saisie brute de 1 à 120 points de code. NFC, espaces Unicode regroupées et
        extrémités supprimées, puis limite configurée 1..120 sans troncature ; vide, sans lettre ni
        chiffre Unicode ou trop longue : REQUETE_INVALIDE. rechercheId client renvoyé tel quel, sans
        reçu, pour ignorer les réponses tardives. Classement et déduplication déterministes selon le
        README ; interprétations distinctes et Chansons non inscriptibles conservées, seul le malformé
        est exclu. Aucun résultat : 200 chansons:[]. Aucune publication. Animateur du Lieu ou Joueur
        présent, retardataire compris. Refus (groupes N, V, T, S) : 400 REQUETE_INVALIDE, 401
        AUTHENTIFICATION_REQUISE, 403 ACCES_REFUSE, 404 RESSOURCE_INTROUVABLE, 409 ETAPE_INACTIVE, 503
        SERVICE_INDISPONIBLE, 503 SOURCE_PAROLES_INDISPONIBLE ; aucun 422. Conditions de chaque code :
        tableau des groupes de refus, README.md, section Karaoké, « Routes et codes de refus ».'
