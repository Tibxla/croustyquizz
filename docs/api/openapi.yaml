  /api/soirees/{soireeId}/manches/{mancheId}/questions/{etapeId}/reponses:
    post:
      operationId: envoyerReponse
      summary: Enregistrer une Réponse définitive
      description: 'Seul le Joueur identifié par le jeton peut répondre pour lui-même. Première réception : Question
        active, ouverte et non en pause, proposition appartenant à cette Question ; recueLe < echeanceLe, sinon
        409 HORS_DELAI. Une seule Réponse acceptée par Joueur/etapeId. Dédupliquer avant le contrôle de délai :
        même auteur, route et envoiId, même contenu = accusé original, même après clôture. Même envoiId avec autre
        contenu = 409 ENVOI_REUTILISE ; nouvel envoiId pour modifier la Réponse = 409 REPONSE_DEJA_ENREGISTREE.
        Déduplication conservée jusqu’à expiration de l’accès Joueur, au minimum jusqu’à la fin de la Soirée. L’accusé
        ne révèle pas la justesse. Une Question manquée ne peut être rejouée. Un Joueur arrivé pendant cette Manche
        n’est pas éligible avant la Manche suivante : 409 ETAT_INCOMPATIBLE.'
      tags:
      - Quiz
      security:
