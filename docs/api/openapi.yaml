        plus proche du fichier (VERSION_ADAPTEE), sinon celles de l’inscription (REPLI_INSCRIPTION) : le
        choix ne refuse jamais la déclaration, et jamais par SOURCE_PAROLES_INDISPONIBLE. Le décalage
        mémorisé pour la même Chanson, la même version et le même fichier devient le decalageMs initial.
        Publie lecture-chanson-modifiee sur la salle et la Console. Une déclaration arrivée après « Je suis
        prêt » est périmée et ne lance jamais le fichier. Propres, dans l’ordre : 409 COMMANDE_PERIMEE
        (Passage non APPELE, compteur ou étape) ; 409 LECTEUR_NON_DESIGNE (autre lecteurId que le désigné).
        Refus communs : 400 REQUETE_INVALIDE, 401 AUTHENTIFICATION_REQUISE, 403 ACCES_REFUSE, 404
        RESSOURCE_INTROUVABLE (Manche ou Passage inconnus, hors portée), 409 ENVOI_REUTILISE, 409
        ETAPE_INACTIVE (sans reçu), 409 ETAT_INCOMPATIBLE (Manche terminée), 503 SERVICE_INDISPONIBLE (sans
        reçu). Ordre : accès, état de la Manche (pause comprise), puis gardes d’objet ; un Passage clos, une
        étape, un compteur, un lectureId ou un demandeId qui ne sont plus les actuels donnent
