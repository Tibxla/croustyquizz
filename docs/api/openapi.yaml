    post:
      operationId: desinscrirePassage
      summary: Désinscrire son Passage en attente
      description: 'Réservé au Joueur qui a inscrit le Passage ; l’attente d’un autre Joueur donne
        RESSOURCE_INTROUVABLE. Garde du compteur de la cible ; cible sortie de l’attente :
