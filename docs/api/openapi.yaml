      summary: Relever la position du lecteur local
      description: 'Manche Karaoké active en Soirée EN_COURS. Écran lecteur de la lecture, en réponse à la demande de
        position publiée dans la vue salle. Le serveur calcule decalageMs depuis la première ligne non
        blanche, efface la demande et publie calage-chanson-modifie sur la salle et la Console. Une demande
        sans réponse reste en attente jusqu’à un nouveau geste ; le relevé d’une demande remplacée ou
        effacée reçoit COMMANDE_PERIMEE. Propres, dans l’ordre : 409 COMMANDE_PERIMEE (Passage clos, étape,
        lectureId ou demandeId) ; 409 LECTEUR_NON_DESIGNE (autre lecteurId que celui de la lecture) ; 409
        ETAT_INCOMPATIBLE (lecture PREPAREE, en paroles seules ou EN_ERREUR). Refus communs : 400
        REQUETE_INVALIDE, 401 AUTHENTIFICATION_REQUISE, 403 ACCES_REFUSE, 404 RESSOURCE_INTROUVABLE (Manche
        ou Passage inconnus, hors portée), 409 ENVOI_REUTILISE, 409 ETAPE_INACTIVE (sans reçu), 409
        ETAT_INCOMPATIBLE (Manche terminée), 503 SERVICE_INDISPONIBLE (sans reçu). Ordre : accès, état de la
        Manche (pause comprise), puis gardes d’objet ; un Passage clos, une étape, un compteur, un lectureId
        ou un demandeId qui ne sont plus les actuels donnent COMMANDE_PERIMEE, jamais 404. Reçu et rejeu :
        README.md, section Karaoké, « Passage : appel, lecture et calage ».'
      tags:
      - Karaoké
      security:
      - cleEcran: []
      parameters:
      - name: soireeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: mancheId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: passageId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          format: uuid
        description: UUID de l’envoi ; identité de l’Écran de salle issue de sa clé, jamais du corps.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/$defs/RelevePositionLecture
      responses:
        '200':
          description: Reçu immuable, sans Location. Ne remplace pas une vue plus récente.
          headers:
            Cache-Control:
              description: Toujours no-store.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: ./schemas.yaml#/$defs/AccuseLectureChanson
        '400':
          $ref: '#/components/responses/Erreur400'
        '401':
          $ref: '#/components/responses/Erreur401'
        '403':
          $ref: '#/components/responses/Erreur403'
        '404':
          $ref: '#/components/responses/Erreur404'
        '409':
          $ref: '#/components/responses/Erreur409'
        '503':
          $ref: '#/components/responses/Erreur503'
components:
  securitySchemes:
    sessionAnimateur:
      type: apiKey
      in: cookie
      name: JSESSIONID
      description: Session d’un Animateur ; opérations mutantes protégées par X-CSRF-TOKEN. Le Lieu est déterminé
        par la session.
    jetonJoueur:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Jeton de reconnexion opaque remis au Joueur ; le serveur en déduit son identité et sa Soirée.
    cleEcran:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Capacité limitée à une Soirée, créée par un Animateur. Elle lit la salle et les résultats et envoie
        les cinq commandes du lecteur de l’Écran de salle (designerLecteurChanson, declarerLectureChanson,
        signalerFinLectureChanson, signalerErreurLectureChanson, releverPositionLecture), sans aucune action de
        jeu ni vue privée.
  responses:
    Erreur400:
      description: JSON, paramètre ou identifiant mal formé.
      headers:
        Cache-Control:
          description: Toujours no-store, notamment pour les secrets, vues et corrections.
          schema:
            type: string
            const: no-store
      content:
        application/problem+json:
          schema:
            $ref: ./schemas.yaml#/$defs/Probleme
    Erreur401:
      description: Identité absente, invalide ou expirée.
      headers:
        Cache-Control:
          description: Toujours no-store, notamment pour les secrets, vues et corrections.
          schema:
            type: string
            const: no-store
      content:
        application/problem+json:
          schema:
            $ref: ./schemas.yaml#/$defs/Probleme
    Erreur403:
      description: CSRF invalide ou action non autorisée.
      headers:
        Cache-Control:
          description: Toujours no-store, notamment pour les secrets, vues et corrections.
          schema:
            type: string
            const: no-store
      content:
        application/problem+json:
          schema:
            $ref: ./schemas.yaml#/$defs/Probleme
    Erreur404:
      description: Ressource inconnue ou hors du Lieu/de la Soirée autorisés.
      headers:
        Cache-Control:
          description: Toujours no-store, notamment pour les secrets, vues et corrections.
          schema:
            type: string
            const: no-store
      content:
        application/problem+json:
          schema:
            $ref: ./schemas.yaml#/$defs/Probleme
    Erreur409:
      description: Conflit avec l’état courant, l’unicité ou l’idempotence ; COMMANDE_PERIMEE si la cible
        et sa version rendent la commande sans objet (ADR 0006), sans mutation.
      headers:
        Cache-Control:
          description: Toujours no-store, notamment pour les secrets, vues et corrections.
          schema:
            type: string
            const: no-store
      content:
        application/problem+json:
          schema:
            $ref: ./schemas.yaml#/$defs/Probleme
    Erreur422:
      description: Données ne respectant pas le contrat.
      headers:
        Cache-Control:
          description: Toujours no-store, notamment pour les secrets, vues et corrections.
          schema:
            type: string
            const: no-store
      content:
        application/problem+json:
          schema:
            $ref: ./schemas.yaml#/$defs/Probleme
    Erreur503:
      description: 'SERVICE_INDISPONIBLE : base ou transaction indisponible. SOURCE_PAROLES_INDISPONIBLE :
        consultation externe en échec sur les routes Karaoké prévues. Aucun reçu. Pour réessayer une mutation
        qui utilise une clé d’idempotence, conserver la clé et le contenu.'
      headers:
        Cache-Control:
          description: Toujours no-store, notamment pour les secrets, vues et corrections.
          schema:
            type: string
            const: no-store
      content:
        application/problem+json:
          schema:
            $ref: ./schemas.yaml#/$defs/Probleme
