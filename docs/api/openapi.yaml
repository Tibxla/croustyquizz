  /api/soirees/{soireeId}/manches/{mancheId}/passages:
    post:
      operationId: inscrirePassage
      summary: Inscrire son Passage
      description: 'Joueur présent, retardataire compris : eligiblePourMancheActive n’est jamais une
        garde. chansonId de 1 à 128 caractères, sinon REQUETE_INVALIDE. Reçu consulté avant le métier,
        source consultée hors verrou, revalidation sous verrou. Gardes dans l’ordre : sans voix, paroles
        non synchronisées (absentes et inconnues incluses), durée inconnue, doublon personnel en
        attente, quota EN_ATTENTE. Détail de la Chanson figé à l’inscription ; la même Chanson reste
        permise à deux Joueurs ; source audio et fichier local sans incidence. Reçu et rejeu :
        README.md, section Karaoké, « Commandes, compteurs et reçus ». Refus (groupes N, V, X, D, T,
        S) : 400 REQUETE_INVALIDE, 401 AUTHENTIFICATION_REQUISE, 403 ACCES_REFUSE, 404
        RESSOURCE_INTROUVABLE, 409 ETAPE_INACTIVE, 409 ETAT_INCOMPATIBLE, 409 ENVOI_REUTILISE, 503
        SERVICE_INDISPONIBLE, 503 SOURCE_PAROLES_INDISPONIBLE. Propres à cette route : 409
        PASSAGE_DEJA_INSCRIT (doublon personnel en attente), 409 LIMITE_ATTEINTE (quota EN_ATTENTE
        atteint), 422 CHANSON_INDISPONIBLE (contenu inutilisable, detail motivé). Conditions de chaque
        code : tableau des groupes de refus, README.md, section Karaoké, « Routes et codes de refus ».'
