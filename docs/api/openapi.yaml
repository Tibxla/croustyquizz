    post:
      operationId: appelerPassage
      summary: Appeler le Passage en tête de la File d’attente
      description: 'Manche Karaoké active en Soirée EN_COURS. Animateur du Lieu. Appelle le Passage en position 1 :
        EN_ATTENTE vers APPELE, étape créée par le serveur, échéance à delaiAppelMs (trente secondes) ;
        numeroModification augmente. Un seul événement passage-appele publie l’appel et la File d’attente
        recalculée sur la salle, la Console et toutes les Manettes. Le saut automatique relève de #25 :
        d’ici là, le Pilotage Manuel s’applique quel que soit soiree.pilotage. Propres, dans l’ordre : 409
        ETAT_INCOMPATIBLE (Manche en pause, puis courant actif) ; 409 COMMANDE_PERIMEE (compteur, Passage
        sorti de l’attente ou plus en position 1). Refus communs : 400 REQUETE_INVALIDE, 401
        AUTHENTIFICATION_REQUISE, 403 ACCES_REFUSE, 403 CSRF_INVALIDE, 404 RESSOURCE_INTROUVABLE (Manche ou
        Passage inconnus, hors portée), 409 ENVOI_REUTILISE, 409 ETAPE_INACTIVE (sans reçu), 409
        ETAT_INCOMPATIBLE (Manche terminée), 503 SERVICE_INDISPONIBLE (sans reçu). Ordre : accès, état de la
        Manche (pause comprise), puis gardes d’objet ; un Passage clos, une étape, un compteur, un lectureId
        ou un demandeId qui ne sont plus les actuels donnent COMMANDE_PERIMEE, jamais 404. Reçu et rejeu :
        README.md, section Karaoké, « Passage : appel, lecture et calage ».'
