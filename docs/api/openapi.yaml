  /api/soirees/{soireeId}/commandes:
    post:
      operationId: piloterSoiree
      summary: Lancer, enchaîner ou terminer la Soirée
      description: 'LANCER : OUVERTE vers EN_COURS et démarrage de la première Manche ; programme non vide et toutes
        Questions prêtes sinon 409 PROGRAMME_INCOMPLET. MANCHE_SUIVANTE : EN_COURS avec Manche précédente terminée
        ; démarre la suivante ou termine la Soirée si le programme est épuisé. TERMINER : EN_COURS vers TERMINEE
        et clôture de la Manche active. En Manuel, la fin naturelle d’une Manche attend MANCHE_SUIVANTE. La correction
        d’une Question attend PASSER_ETAPE avant la prochaine Question ; le serveur déclenche la correction à l’échéance
        ou sur PASSER_ETAPE. Idempotence selon Idempotency-Key.'
      tags:
      - Soirée
      security:
      - sessionAnimateur: []
      responses:
        '200':
          description: Opération réussie.
          headers:
            Cache-Control:
              description: Toujours no-store, notamment pour les secrets, vues et corrections.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: ./schemas.yaml#/$defs/AccuseCommande
        '400':
          $ref: '#/components/responses/Erreur400'
        '401':
          $ref: '#/components/responses/Erreur401'
        '403':
          $ref: '#/components/responses/Erreur403'
        '404':
          $ref: '#/components/responses/Erreur404'
        '409':
          $ref: '#/components/responses/Erreur409'
        '422':
          $ref: '#/components/responses/Erreur422'
      parameters:
      - name: soireeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        required: true
        description: 'UUID de cet envoi de commande. Même auteur, même route et même clé : résultat initial ; clé
          réutilisée avec un autre contenu : 409 ENVOI_REUTILISE.'
        schema:
          type: string
          format: uuid
      - name: X-CSRF-TOKEN
        in: header
        required: true
