    post:
      operationId: inscrirePassage
      summary: Inscrire son Passage
      description: 'Accès/reçu/état, consultation de la source hors verrou, revalidation sous verrou.
        Gardes : sans voix, paroles non synchronisées (absentes/inconnues incluses), durée inconnue,
        doublon, quota. Détail de Chanson figé à l’inscription. Même Chanson permise à deux Joueurs.
        Source audio et fichier local sans incidence sur l’inscription. Manche Karaoké active
        EN_COURS/EN_PAUSE, Soirée EN_COURS. Identité déduite de l’accès ; hors portée : 404. Présence
        du Joueur suffisante, y compris retardataire ; eligiblePourMancheActive ne sert jamais de
        garde Karaoké. Règles détaillées : README.md, section Karaoké. Après schéma et accès : reçu
        avant métier, clé acteur(type/id)+route concrète+envoiId, empreinte méthode+JSON canonique.
        Même contenu : statut et corps initiaux, même après retrait/fin ; contenu différent :
        ENVOI_REUTILISE. Succès et refus définitifs conservés jusqu’à expiration de l’accès, au
