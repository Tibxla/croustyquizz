      summary: Rechercher des Chansons
      description: 'Saisie brute : 1 à 120 points de code. NFC, espaces Unicode regroupées et extrémités
        supprimées, puis limite configurée 1..120 sans troncature. Vide, sans lettre/chiffre Unicode
        ou trop longue : REQUETE_INVALIDE. rechercheId client renvoyé tel quel, sans reçu, pour
        ignorer les réponses tardives. Classement/déduplication déterministes selon README ;
        interprétations distinctes et non inscriptibles conservées, seul le malformé est exclu. Aucun
        résultat : 200 chansons:[], aucune publication. Manche Karaoké active EN_COURS/EN_PAUSE,
        Soirée EN_COURS. Identité déduite de l’accès ; hors portée : 404. Présence du Joueur
        suffisante, y compris retardataire ; eligiblePourMancheActive ne sert jamais de garde Karaoké.
        Règles détaillées : README.md, section Karaoké. Refus : 400 REQUETE_INVALIDE (saisie ou
        schéma), 401 AUTHENTIFICATION_REQUISE (identité), 403 ACCES_REFUSE (rôle), 404
        RESSOURCE_INTROUVABLE (inconnu, hors portée Soirée/Lieu, attente d’autrui ou Chanson disparue)
        ; 409 ETAPE_INACTIVE (Manche non active en EN_COURS/EN_PAUSE ou Soirée non EN_COURS) ; 503
        SERVICE_INDISPONIBLE (base ou transaction) ; 503 SOURCE_PAROLES_INDISPONIBLE (délai, taille,
        protocole ou HTTP externe en échec, sauf 404 de fiche/inscription).'
