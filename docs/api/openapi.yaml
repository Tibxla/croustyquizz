              $ref: ./schemas.yaml#/$defs/CommandeSoiree
  /api/soirees/{soireeId}/manches/{mancheId}/commandes:
    post:
      operationId: piloterManche
      summary: Intervenir sur la Manche active
      description: 'Uniquement la Manche active en Soirée EN_COURS. METTRE_EN_PAUSE gèle une Question ouverte ;
        REPRENDRE rétablit son délai restant. PASSER_ETAPE clôt la Question ouverte et révèle la correction, ou
        passe de CORRECTION à la Question suivante ; après la dernière correction, termine la Manche. TERMINER arrête
        la Manche sans révéler une Question abandonnée ni lui attribuer de points. Idempotence selon Idempotency-Key
        ; etapeId périmé : 409 ETAPE_INACTIVE.'
      tags:
      - Soirée
      security:
      - sessionAnimateur: []
      responses:
        '200':
          description: Opération réussie.
          headers:
            Cache-Control:
              description: Toujours no-store, notamment pour les secrets, vues et corrections.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: ./schemas.yaml#/$defs/AccuseCommande
        '400':
