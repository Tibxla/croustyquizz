      description: 'Animateur du Lieu. true remplace l’unique priorité, placée juste après le courant ;
        false retire celle de la cible, sinon reste sans effet. L’ordre normal est conservé sous la
        priorité et rétabli au retrait ou au remplacement. Seuls les Passages affectés incrémentent leur
