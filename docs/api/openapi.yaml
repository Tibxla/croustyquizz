  /api/soirees/{soireeId}/manches/{mancheId}/commandes:
    post:
      operationId: piloterManche
      summary: Intervenir sur la Manche active
      description: 'Uniquement la Manche active en Soirée EN_COURS. Idempotence selon Idempotency-Key. Quiz :
        METTRE_EN_PAUSE gèle une Question ouverte ; REPRENDRE rétablit son délai restant. PASSER_ETAPE clôt la
        Question ouverte et révèle la correction, ou passe de CORRECTION à la Question suivante ; après la dernière
        correction, termine la Manche. TERMINER arrête la Manche sans révéler une Question abandonnée ni lui
        attribuer de points. etapeId absent ou non courant : 409 ETAPE_INACTIVE. Karaoké : etapeId est celui du
        courant actif (APPELE, EN_COURS ou EN_PAUSE), créé à l’appel, et il est omis sans courant actif ; 409
        ETAPE_INACTIVE s’il est absent ou différent avec un courant actif, présent sans courant actif, et pour
        PASSER_ETAPE sans courant actif, etapeId omis ou non, même si le courant affiché est TERMINE ou SAUTE.
        METTRE_EN_PAUSE fige le délai d’appel restant ou la chronologie du Passage, REPRENDRE les restitue ; 409
        ETAT_INCOMPATIBLE pour REPRENDRE pendant une lecture EN_ERREUR. PASSER_ETAPE saute le courant actif
        (SAUTE, Tour conservé, passage-saute), et une Manche en pause le reste. TERMINER annule le courant actif
        (ANNULE, Tour conservé, lecture arrêtée) et le bloc karaoke devient null. Conditions : README.md,
        section Karaoké, « Passage : appel, lecture et calage ».'
