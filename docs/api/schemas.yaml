$schema: https://json-schema.org/draft/2020-12/schema
$defs:
  Csrf:
    type: object
    additionalProperties: false
    properties:
      headerName:
        type: string
        const: X-CSRF-TOKEN
      token:
        type: string
        minLength: 16
    required:
    - headerName
    - token
  Heure:
    type: object
    additionalProperties: false
    properties:
      maintenant:
        type: string
        format: date-time
    required:
    - maintenant
  InscriptionAnimateur:
    type: object
    additionalProperties: false
    properties:
      lieu:
        type: object
        additionalProperties: false
        properties:
          nom:
            type: string
            minLength: 1
            maxLength: 120
          ville:
            type: string
            minLength: 1
            maxLength: 120
        required:
        - nom
        - ville
      nom:
        type: string
        minLength: 1
        maxLength: 120
      email:
        type: string
        format: email
        maxLength: 254
      motDePasse:
        type: string
        minLength: 12
        maxLength: 128
    required:
    - lieu
    - nom
    - email
    - motDePasse
  ConnexionAnimateur:
    type: object
    additionalProperties: false
    properties:
      email:
        type: string
        format: email
        maxLength: 254
      motDePasse:
        type: string
        minLength: 1
        maxLength: 128
    required:
    - email
    - motDePasse
  Animateur:
    type: object
    additionalProperties: false
    properties:
      id:
        type: string
        format: uuid
      nom:
        type: string
        minLength: 1
      lieuId:
        type: string
        format: uuid
    required:
    - id
    - nom
    - lieuId
  Lieu:
    type: object
    additionalProperties: false
    properties:
      id:
        type: string
        format: uuid
      nom:
        type: string
        minLength: 1
      ville:
        type: string
        minLength: 1
    required:
    - id
    - nom
    - ville
  CompteCree:
    type: object
    additionalProperties: false
    properties:
      animateur:
        $ref: '#/$defs/Animateur'
      lieu:
        $ref: '#/$defs/Lieu'
    required:
    - animateur
    - lieu
  CreationSoiree:
    type: object
    additionalProperties: false
    properties:
      titre:
        type: string
        minLength: 1
        maxLength: 150
      format:
        type: string
        enum:
        - SOLO
        - EQUIPE
      pilotage:
        type: string
        enum:
        - MANUEL
        - AUTOMATIQUE
    required:
    - titre
    - format
    - pilotage
  ModificationSoiree:
    type: object
    additionalProperties: false
    properties:
      titre:
        type: string
        minLength: 1
        maxLength: 150
    required:
    - titre
  Soiree:
    type: object
    additionalProperties: false
    properties:
      id:
        type: string
        format: uuid
      titre:
        type: string
        minLength: 1
      format:
        type: string
        enum:
        - SOLO
        - EQUIPE
      pilotage:
        type: string
        enum:
        - MANUEL
        - AUTOMATIQUE
      etat:
        type: string
        enum:
        - PREPARATION
        - OUVERTE
        - EN_COURS
        - TERMINEE
      codeAcces:
        oneOf:
        - type: string
          pattern: ^[A-Z0-9]{6}$
        - type: 'null'
    required:
    - id
    - titre
    - format
    - pilotage
    - etat
    - codeAcces
  ListeSoirees:
    type: object
    additionalProperties: false
    properties:
      soirees:
        type: array
        items:
          $ref: '#/$defs/Soiree'
    required:
    - soirees
  Rejoindre:
    type: object
    additionalProperties: false
    properties:
      codeAcces:
        type: string
        pattern: ^[A-Z0-9]{6}$
      pseudo:
        type: string
        minLength: 1
        maxLength: 30
    required:
    - codeAcces
    - pseudo
  JoueurPublic:
    type: object
    additionalProperties: false
    properties:
      id:
        type: string
        format: uuid
      pseudo:
        type: string
        minLength: 1
      connecte:
        type: boolean
    required:
    - id
    - pseudo
    - connecte
  AccesJoueur:
    type: object
    additionalProperties: false
    properties:
      soireeId:
        type: string
        format: uuid
      joueur:
        $ref: '#/$defs/JoueurPublic'
      jetonReconnexion:
        type: string
        minLength: 43
        maxLength: 128
        pattern: ^[A-Za-z0-9_-]+$
    required:
    - soireeId
    - joueur
    - jetonReconnexion
    description: Le jeton opaque identifie le Joueur pour HTTP et STOMP. Ne jamais le publier sur un canal ou dans
      une URL.
  AccesEcran:
    type: object
    additionalProperties: false
    properties:
      soireeId:
        type: string
        format: uuid
      cleEcran:
        type: string
        minLength: 43
        maxLength: 128
        pattern: ^[A-Za-z0-9_-]+$
      expireLe:
        type: string
        format: date-time
    required:
    - soireeId
    - cleEcran
    - expireLe
    description: Capacité de l'Écran de salle, limitée à cette Soirée. Elle lit la salle et envoie les seules
      commandes de son lecteur (designerLecteurChanson, declarerLectureChanson, signalerFinLectureChanson,
      signalerErreurLectureChanson, releverPositionLecture), sans aucune action de jeu. Transport dans
      Authorization/CONNECT, jamais dans une chaîne de requête. La durée est donnée par expireLe.
  ModeDeJeu:
    type: string
    enum:
    - QUIZ
    - BLIND_TEST
    - KARAOKE
    - FREESTYLE
  ReglagesQuiz:
    type: object
    additionalProperties: false
    properties:
      nombreEtapes:
        type: integer
        minimum: 1
        maximum: 100
      tempsParEtapeSecondes:
        type: integer
        minimum: 1
        maximum: 3600
    required:
    - nombreEtapes
    - tempsParEtapeSecondes
  CreationManche:
    type: object
    additionalProperties: false
    properties:
      mode:
        type: string
        enum:
        - QUIZ
        - BLIND_TEST
        - KARAOKE
        - FREESTYLE
      reglages:
        oneOf:
        - $ref: '#/$defs/ReglagesQuiz'
        - $ref: '#/$defs/ReglagesBlindTest'
        - $ref: '#/$defs/ReglagesKaraoke'
        - $ref: '#/$defs/ReglagesFreestyle'
    required:
    - mode
    - reglages
    allOf:
    - if:
        properties:
          mode:
            const: QUIZ
      then:
        properties:
          reglages:
            $ref: '#/$defs/ReglagesQuiz'
    - if:
        properties:
          mode:
            const: BLIND_TEST
      then:
        properties:
          reglages:
            $ref: '#/$defs/ReglagesBlindTest'
    - if:
        properties:
          mode:
            const: KARAOKE
      then:
        properties:
          reglages:
            $ref: '#/$defs/ReglagesKaraoke'
    - if:
        properties:
          mode:
            const: FREESTYLE
      then:
        properties:
          reglages:
            $ref: '#/$defs/ReglagesFreestyle'
  Manche:
    type: object
    additionalProperties: false
    properties:
      id:
        type: string
        format: uuid
      ordre:
        type: integer
        minimum: 0
      mode:
        type: string
        enum:
        - QUIZ
        - BLIND_TEST
        - KARAOKE
        - FREESTYLE
      etat:
        type: string
        enum:
        - EN_ATTENTE
        - EN_COURS
        - EN_PAUSE
        - TERMINEE
      reglages:
        oneOf:
        - $ref: '#/$defs/ReglagesQuiz'
        - $ref: '#/$defs/ReglagesBlindTest'
        - $ref: '#/$defs/ReglagesKaraoke'
        - $ref: '#/$defs/ReglagesFreestyle'
    required:
    - id
    - ordre
    - mode
    - etat
    - reglages
    allOf:
    - if:
        properties:
          mode:
            const: QUIZ
      then:
        properties:
          reglages:
            $ref: '#/$defs/ReglagesQuiz'
    - if:
        properties:
          mode:
            const: BLIND_TEST
      then:
        properties:
          reglages:
            $ref: '#/$defs/ReglagesBlindTest'
    - if:
        properties:
          mode:
            const: KARAOKE
      then:
        properties:
          reglages:
            $ref: '#/$defs/ReglagesKaraoke'
            required:
            - limitePassagesEnAttente
    - if:
        properties:
          mode:
            const: FREESTYLE
      then:
        properties:
          reglages:
            $ref: '#/$defs/ReglagesFreestyle'
  OrdreManches:
    type: object
    additionalProperties: false
    properties:
      mancheIds:
        type: array
        items:
          type: string
          format: uuid
        minItems: 1
        uniqueItems: true
    required:
    - mancheIds
    description: Permutation exacte des Manches existantes de la Soirée, sans omission ni identifiant étranger.
  QuestionSaisie:
    type: object
    additionalProperties: false
    properties:
      enonce:
        type: string
        minLength: 1
        maxLength: 1000
      categorie:
        type: string
        minLength: 1
        maxLength: 120
      difficulte:
        type: string
        enum:
        - FACILE
        - MOYENNE
        - DIFFICILE
      propositions:
        type: array
        items:
          type: string
          minLength: 1
          maxLength: 300
        minItems: 4
        maxItems: 4
        uniqueItems: true
      indexPropositionJuste:
        type: integer
        minimum: 0
        maximum: 3
    required:
    - enonce
    - categorie
    - difficulte
    - propositions
    - indexPropositionJuste
  QuestionsSaisies:
    type: object
    additionalProperties: false
    properties:
      questions:
        type: array
        items:
          $ref: '#/$defs/QuestionSaisie'
        minItems: 1
        maxItems: 100
    required:
    - questions
    description: Liste ordonnée de Questions rédigées par l’Animateur. Le serveur affecte leurs identifiants et
      la source ANIMATEUR. Le nombre doit correspondre à nombreEtapes avant lancement.
  PropositionPublique:
    type: object
    additionalProperties: false
    properties:
      id:
        type: string
        format: uuid
      texte:
        type: string
        minLength: 1
      position:
        type: integer
        minimum: 0
        maximum: 3
    required:
    - id
    - texte
    - position
  QuestionPreparee:
    type: object
    additionalProperties: false
    properties:
      id:
        type: string
        format: uuid
      enonce:
        type: string
        minLength: 1
      categorie:
        type: string
        minLength: 1
      difficulte:
        type: string
        enum:
        - FACILE
        - MOYENNE
        - DIFFICILE
      source:
        type: string
        enum:
        - ANIMATEUR
      propositions:
        type: array
        items:
          $ref: '#/$defs/PropositionPublique'
        minItems: 4
        maxItems: 4
      propositionJusteId:
        type: string
        format: uuid
    required:
    - id
    - enonce
    - categorie
    - difficulte
    - source
    - propositions
    - propositionJusteId
    description: Vue privée de préparation, réservée à un Animateur du Lieu.
  QuestionsPreparees:
    type: object
    additionalProperties: false
    properties:
      questions:
        type: array
        items:
          $ref: '#/$defs/QuestionPreparee'
    required:
    - questions
  QuestionPublique:
    type: object
    additionalProperties: false
    properties:
      etapeId:
        type: string
        format: uuid
      questionId:
        type: string
        format: uuid
      numero:
        type: integer
        minimum: 1
      total:
        type: integer
        minimum: 1
      enonce:
        type: string
        minLength: 1
      propositions:
        type: array
        items:
          $ref: '#/$defs/PropositionPublique'
        minItems: 4
        maxItems: 4
    required:
    - etapeId
    - questionId
    - numero
    - total
    - enonce
    - propositions
  Correction:
    type: object
    additionalProperties: false
    properties:
      propositionJusteId:
        type: string
        format: uuid
      repartition:
        type: array
        items:
          type: object
          additionalProperties: false
          properties:
            propositionId:
              type: string
              format: uuid
            nombreReponses:
              type: integer
              minimum: 0
          required:
          - propositionId
          - nombreReponses
        minItems: 4
        maxItems: 4
    required:
    - propositionJusteId
    - repartition
  QuizAttente:
    type: object
    additionalProperties: false
    properties:
      phase:
        type: string
        enum:
        - ATTENTE
        - TERMINEE
    required:
    - phase
  QuizOuvert:
    type: object
    additionalProperties: false
    properties:
      phase:
        type: string
        const: QUESTION_OUVERTE
      question:
        $ref: '#/$defs/QuestionPublique'
      ouverteLe:
        type: string
        format: date-time
      echeanceLe:
        type: string
        format: date-time
    required:
    - phase
    - question
    - ouverteLe
    - echeanceLe
  QuizPause:
    type: object
    additionalProperties: false
    properties:
      phase:
        type: string
        const: EN_PAUSE
      question:
        $ref: '#/$defs/QuestionPublique'
      tempsRestantMs:
        type: integer
        minimum: 0
    required:
    - phase
    - question
    - tempsRestantMs
  QuizCorrection:
    type: object
    additionalProperties: false
    properties:
      phase:
        type: string
        const: CORRECTION
      question:
        $ref: '#/$defs/QuestionPublique'
      correction:
        $ref: '#/$defs/Correction'
    required:
    - phase
    - question
    - correction
  EtatQuiz:
    oneOf:
    - $ref: '#/$defs/QuizAttente'
    - $ref: '#/$defs/QuizOuvert'
    - $ref: '#/$defs/QuizPause'
    - $ref: '#/$defs/QuizCorrection'
  LigneClassement:
    type: object
    additionalProperties: false
    properties:
      concurrentId:
        type: string
        format: uuid
      nom:
        type: string
        minLength: 1
      rang:
        type: integer
        minimum: 1
      points:
        type: integer
        minimum: 0
      bonnesReponses:
        type: integer
        minimum: 0
      tempsCumuleMs:
        type: integer
        minimum: 0
    required:
    - concurrentId
    - nom
    - rang
    - points
    - bonnesReponses
    - tempsCumuleMs
    description: Cumul des Points déjà attribués dans les Manches de Quiz et de Blind test de la Soirée.
      Au Quiz, seuls les Points des Questions corrigées sont visibles. Le rang suit les Points décroissants,
      puis le nombre de bonnes réponses décroissant, puis leur temps cumulé croissant.
      Les ex æquo partagent le même rang, avec saut du rang suivant (1, 1, 3).
  Classement:
    type: object
    additionalProperties: false
    description: Classement général complet par rang croissant, conservé après la fin de la Soirée.
    properties:
      soireeId:
        type: string
        format: uuid
      classement:
        type: array
        description: Indique tous les Concurrents qui ont des Points attribués, par rang croissant.
        items:
          $ref: '#/$defs/LigneClassement'
    required:
    - soireeId
    - classement
  CommandeSoiree:
    type: object
    additionalProperties: false
    properties:
      action:
        type: string
        enum:
        - LANCER
        - MANCHE_SUIVANTE
        - TERMINER
    required:
    - action
  CommandeManche:
    type: object
    additionalProperties: false
    properties:
      action:
        type: string
        enum:
        - METTRE_EN_PAUSE
        - REPRENDRE
        - PASSER_ETAPE
        - TERMINER
      etapeId:
        type: string
        format: uuid
    required:
    - action
    description: etapeId désigne l’étape courante et doit alors lui correspondre, sinon 409 ETAPE_INACTIVE. Pour
      le Quiz, il est toujours présent ; la correction reste attachée au même etapeId jusqu’à l’étape suivante.
      Au Karaoké, un Passage actif (APPELE, EN_COURS ou EN_PAUSE) a une étape, créée à l’appel ; etapeId est
      omis seulement sans Passage actif, et PASSER_ETAPE y donne ETAPE_INACTIVE. Au Blind test, il est toujours
      présent et nomme le Morceau affiché, même pendant sa Révélation.
  AccuseCommande:
    type: object
    additionalProperties: false
    properties:
      envoiId:
        type: string
        format: uuid
      recueLe:
        type: string
        format: date-time
      soireeId:
        type: string
        format: uuid
    required:
    - envoiId
    - recueLe
    - soireeId
  ReponseSaisie:
    type: object
    additionalProperties: false
    properties:
      envoiId:
        type: string
        format: uuid
      propositionId:
        type: string
        format: uuid
    required:
    - envoiId
    - propositionId
    description: Aucune identité, date, durée ou valeur de points fournie par le navigateur n’est acceptée.
  AccuseReponse:
    type: object
    additionalProperties: false
    properties:
      envoiId:
        type: string
        format: uuid
      reponseId:
        type: string
        format: uuid
      etapeId:
        type: string
        format: uuid
      propositionId:
        type: string
        format: uuid
      recueLe:
        type: string
        format: date-time
    required:
    - envoiId
    - reponseId
    - etapeId
    - propositionId
    - recueLe
    description: Accusé immuable sans justesse ni points avant correction. Le même envoi retrouve exactement cet
      accusé.
  ResultatPersonnel:
    type: object
    additionalProperties: false
    properties:
      etapeId:
        type: string
        format: uuid
      juste:
        type: boolean
      pointsGagnes:
        type: integer
        minimum: 0
    required:
    - etapeId
    - juste
    - pointsGagnes
  BuzzSaisi:
    type: object
    additionalProperties: false
    description: Pendant une Manche de Blind test, mancheId et etapeId nomment le Morceau visé et sont exigés
      (400 REQUETE_INVALIDE sinon) ; hors Blind test, ils sont absents (ADR 0009, point 5).
    properties:
      envoiId:
        type: string
        format: uuid
      mancheId:
        type: string
        format: uuid
      etapeId:
        type: string
        format: uuid
    required:
    - envoiId
    dependentRequired:
      mancheId:
      - etapeId
      etapeId:
      - mancheId
  Buzz:
    type: object
    additionalProperties: false
    properties:
      envoiId:
        type: string
        format: uuid
      joueurId:
        type: string
        format: uuid
      pseudo:
        type: string
        minLength: 1
      recuLe:
        type: string
        format: date-time
      rang:
        type: integer
        minimum: 1
    required:
    - envoiId
    - joueurId
    - pseudo
    - recuLe
    - rang
  BlocsDeMode:
    type: object
    description: Un bloc non nul appartient au modeEnCours ; hors Manche, tous les blocs sont nuls ou absents.
    allOf:
    - if:
        required:
        - quiz
        properties:
          quiz:
            not:
              type: 'null'
      then:
        properties:
          modeEnCours:
            const: QUIZ
    - if:
        required:
        - blindtest
        properties:
          blindtest:
            not:
              type: 'null'
      then:
        properties:
          modeEnCours:
            const: BLIND_TEST
    - if:
        required:
        - karaoke
        properties:
          karaoke:
            not:
              type: 'null'
      then:
        properties:
          modeEnCours:
            const: KARAOKE
    - if:
        required:
        - freestyle
        properties:
          freestyle:
            not:
              type: 'null'
      then:
        properties:
          modeEnCours:
            const: FREESTYLE
    - if:
        required:
        - karaoke
        properties:
          karaoke:
            not:
              type: 'null'
      then:
        properties:
          mancheActive:
            type: object
            properties:
              mode:
                const: KARAOKE
              etat:
                type: string
                enum:
                - EN_COURS
                - EN_PAUSE
    - if:
        required:
        - blindtest
        properties:
          blindtest:
            not:
              type: 'null'
      then:
        properties:
          mancheActive:
            type: object
            properties:
              mode:
                const: BLIND_TEST
              etat:
                type: string
                enum:
                - EN_COURS
                - EN_PAUSE
    - if:
        required:
        - freestyle
        properties:
          freestyle:
            not:
              type: 'null'
      then:
        properties:
          mancheActive:
            type: object
            properties:
              mode:
                const: FREESTYLE
              etat:
                type: string
                enum:
                - EN_COURS
                - EN_PAUSE
  ReglageMusiqueDAttente:
    type: object
    additionalProperties: false
    properties:
      etat:
        $ref: '#/$defs/EtatMusiqueDAttente'
    required: [etat]
  EtatMusiqueDAttente:
    type: string
    enum: [JOUE, COUPEE]
    description: Choix de l’Animateur pour la Soirée, JOUE par défaut.
  DisponibiliteMusiqueDAttente:
    type: object
    additionalProperties: false
    properties:
      morceauxDisponibles:
        type: boolean
        description: Le dossier choisi contient au moins un fichier audio dans Attente.
    required: [morceauxDisponibles]
  SignalSonEcran:
    type: object
    additionalProperties: false
    properties:
      abonnementId:
        type: string
        format: uuid
        description: Abonnement actif de cet Écran de salle au canal de salle.
      sonActive:
        type: boolean
        description: Le navigateur de cet Écran a autorisé le son.
    required: [abonnementId, sonActive]
  EtatSonEcran:
    type: string
    enum: [ABSENT, COUPE, ACTIVE]
    description: >
      ACTIVE si au moins un Écran connecté a activé le son, COUPE si tous les Écrans
      qui ont signalé leur état ont le son coupé, ABSENT sans signal actif.
  MusiqueDAttente:
    type: object
    additionalProperties: false
    properties:
      etat:
        $ref: '#/$defs/EtatMusiqueDAttente'
      morceauxDisponibles:
        type: [boolean, 'null']
        description: Dernier signal du dossier de l’Écran de salle ; null avant le premier signal.
    required: [etat, morceauxDisponibles]
  VueSalle:
    allOf:
    - $ref: '#/$defs/BlocsDeMode'
    - if:
        anyOf:
        - properties:
            mancheActive:
              type: object
        - properties:
            soiree:
              properties:
                etat:
                  const: TERMINEE
      then:
        properties:
          photos:
            type: 'null'
    type: object
    additionalProperties: false
    properties:
      photos:
        $ref: '#/$defs/PhotoAfficheeOuVide'
      soiree:
        $ref: '#/$defs/Soiree'
      musiqueAttente:
        $ref: '#/$defs/MusiqueDAttente'
      mancheActive:
        oneOf:
        - $ref: '#/$defs/Manche'
        - type: 'null'
      modeEnCours:
        oneOf:
        - $ref: '#/$defs/ModeDeJeu'
        - type: 'null'
      quiz:
        oneOf:
        - $ref: '#/$defs/EtatQuiz'
        - type: 'null'
      blindtest:
        oneOf:
