          format: date-time
          pattern: Z$
        - type: 'null'
      finPrevueLe:
        oneOf:
        - type: string
          format: date-time
          pattern: Z$
        - type: 'null'
      positionChronologiqueMs:
        oneOf:
        - type: integer
          minimum: 0
          maximum: 9007199254740991
        - type: 'null'
      tempsPauseMs:
        type: integer
        minimum: 0
        maximum: 9007199254740991
        description: Pauses closes après demarreLe ; 0 en APPELE.
      calculeLe:
        type: string
        format: date-time
        pattern: Z$
        description: Instant où le serveur a projeté la vue lors de la mutation ; une capture de même Révision rend la
          même vue.
      clotureLe:
        oneOf:
        - type: string
          format: date-time
          pattern: Z$
        - type: 'null'
