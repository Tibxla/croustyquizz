    - status
    - code
    - detail
    - instance
    description: Erreur JSON Problem Details. Ne contient ni secret, ni solution de Question, ni
      information sur un autre Lieu.
  ReglagesBlindTest:
    type: object
    additionalProperties: false
    description: Réglages publics d’une Manche de Blind test, publiés tels quels à toutes les destinations par
      mancheActive.reglages. La sélection des Morceaux tirés n’y figure jamais (ADR 0009, point 1).
    properties:
      source:
        $ref: '#/$defs/SourceDeMorceaux'
      nombreMorceaux:
        type: integer
        minimum: 1
        maximum: 50
    required:
    - source
    - nombreMorceaux
  SourceDeMorceaux:
    type: object
    additionalProperties: false
    description: Playlist Deezer, ou genre Deezer (son classement), où le serveur tire les Morceaux qui ont un
      extrait. Visible comme un thème annoncé ; ni la sélection ni l’ordre.
    properties:
      type:
        type: string
        enum:
        - PLAYLIST
        - GENRE
      idDeezer:
        type: integer
        minimum: 0
        maximum: 9007199254740991
    required:
    - type
    - idDeezer
  BrouillonProposition:
    type: object
    additionalProperties: false
    description: Saisie en cours du Joueur qui a la main, remplacée à chaque envoi. À l’échéance, le dernier brouillon
      reçu est jugé ; il n’est montré à personne d’autre avant le verdict. Seuls les champs encore demandés comptent.
    properties:
      numero:
        type: integer
        minimum: 1
        maximum: 9007199254740991
        description: Numéro d’envoi croissant pendant la main du Joueur, à partir de 1. Un brouillon dont le numéro
          ne dépasse pas celui du dernier brouillon retenu est ignoré ; après un rechargement, la Manette repart du
          numéro de monBrouillon.
      titre:
        type: string
        maxLength: 200
      artiste:
        type: string
        maxLength: 200
    required:
    - numero
    - titre
    - artiste
  PropositionSaisie:
    type: object
    additionalProperties: false
    description: Proposition validée par le Joueur qui a la main, jugée aussitôt. Aucune identité, date ni valeur de
      points fournie par le navigateur n’est acceptée.
    properties:
      envoiId:
        type: string
        format: uuid
      titre:
        type: string
        maxLength: 200
      artiste:
        type: string
        maxLength: 200
    required:
    - envoiId
    - titre
    - artiste
  VerdictChamp:
    type: string
    enum:
    - JUSTE
    - FAUX
    - NON_DEMANDE
    description: NON_DEMANDE pour une partie déjà trouvée par un autre Joueur, ni demandée ni jugée.
  AccuseProposition:
    type: object
    additionalProperties: false
    description: Verdict immédiat d’une Proposition de titre ; la partie trouvée est publique dans la vue. Le même
      envoi retrouve exactement cet accusé.
    properties:
      envoiId:
        type: string
        format: uuid
      etapeId:
        type: string
        format: uuid
      recueLe:
        type: string
        format: date-time
        pattern: Z$
      titre:
        $ref: '#/$defs/VerdictChamp'
      artiste:
        $ref: '#/$defs/VerdictChamp'
      pointsGagnes:
        type: integer
        enum:
        - 0
        - 30
        - 70
        - 100
    required:
    - envoiId
    - etapeId
    - recueLe
    - titre
    - artiste
    - pointsGagnes
  LectureExtrait:
    type: object
    additionalProperties: false
    description: État de lecture des 30 s d’extrait, mené par l’Horloge du serveur. En lecture, l’extrait était à
      positionMs à l’instant depuisLe ; en pause, il attend à positionMs. L’Écran de salle s’y aligne sans rien
      signaler (ADR 0009, point 3).
    properties:
      etat:
        type: string
        enum:
        - EN_LECTURE
        - EN_PAUSE
      positionMs:
        type: integer
        minimum: 0
        maximum: 30000
      depuisLe:
        oneOf:
        - type: string
          format: date-time
          pattern: Z$
        - type: 'null'
    required:
    - etat
    - positionMs
    - depuisLe
    allOf:
    - if:
        properties:
          etat:
            const: EN_LECTURE
      then:
        properties:
          depuisLe:
            type: string
      else:
        properties:
          depuisLe:
            type: 'null'
  MainBlindTest:
    type: object
    additionalProperties: false
    description: Joueur qui a la main sur le Morceau. L’échéance de sa saisie est gelée pendant une pause de la Manche
      ; tempsRestantMs la remplace alors.
    properties:
      joueurId:
        type: string
        format: uuid
      pseudo:
        type: string
        minLength: 1
      echeanceLe:
        oneOf:
        - type: string
          format: date-time
          pattern: Z$
        - type: 'null'
      tempsRestantMs:
        oneOf:
        - type: integer
          minimum: 0
          maximum: 20000
        - type: 'null'
    required:
    - joueurId
    - pseudo
    - echeanceLe
    - tempsRestantMs
    oneOf:
    - properties:
        echeanceLe:
          type: string
        tempsRestantMs:
          type: 'null'
    - properties:
        echeanceLe:
          type: 'null'
        tempsRestantMs:
          type: integer
  PartieTrouvee:
    type: object
    additionalProperties: false
    description: Titre ou artiste trouvé, montré aussitôt à toutes les destinations ; le Morceau continue pour l’autre
      partie (ADR 0009, point 10).
    properties:
      partie:
        type: string
        enum:
        - TITRE
        - ARTISTE
      valeur:
        type: string
        minLength: 1
      joueurId:
        type: string
        format: uuid
      pseudo:
        type: string
        minLength: 1
      points:
        type: integer
        enum:
        - 30
        - 70
    required:
    - partie
    - valeur
    - joueurId
    - pseudo
    - points
    allOf:
    - if:
        properties:
          partie:
            const: TITRE
      then:
        properties:
          points:
            const: 70
      else:
        properties:
          points:
            const: 30
  RevelationMorceau:
    type: object
    additionalProperties: false
    properties:
      titre:
        type: string
        minLength: 1
      artiste:
        type: string
        minLength: 1
      pochette:
        oneOf:
        - type: string
          format: uri
        - type: 'null'
    required:
    - titre
    - artiste
    - pochette
  BlindTestCommun:
    type: object
    description: Partie du bloc blindtest commune aux trois destinations. revelation n’est non nul qu’en phase
      REVELATION ; avant, seules les parties déjà trouvées sont visibles, aucune en PREPARATION et au plus une en
      EXTRAIT ou PROPOSITION, la seconde déclenchant la Révélation. Pendant une pause de la Manche, main porte
      tempsRestantMs, jamais d’échéance absolue ; hors pause, l’inverse.
    properties:
      mancheId:
        type: string
        format: uuid
      etat:
        type: string
        enum:
        - EN_COURS
        - EN_PAUSE
      etapeId:
        type: string
        format: uuid
        description: Identifiant du Morceau attribué par le serveur, jamais l’identifiant Deezer.
      numero:
        type: integer
        minimum: 1
        maximum: 50
      total:
        type: integer
        minimum: 1
        maximum: 50
      phase:
        type: string
        enum:
        - PREPARATION
        - EXTRAIT
        - PROPOSITION
        - REVELATION
      lecture:
        oneOf:
        - $ref: '#/$defs/LectureExtrait'
        - type: 'null'
      main:
        oneOf:
        - $ref: '#/$defs/MainBlindTest'
        - type: 'null'
      partiesTrouvees:
        type: array
        maxItems: 2
        items:
          $ref: '#/$defs/PartieTrouvee'
      revelation:
        oneOf:
        - $ref: '#/$defs/RevelationMorceau'
        - type: 'null'
    required:
    - mancheId
    - etat
    - etapeId
    - numero
    - total
    - phase
    - lecture
    - main
    - partiesTrouvees
    - revelation
    allOf:
    - if:
        properties:
          phase:
            const: PREPARATION
      then:
        properties:
          lecture:
            type: 'null'
          main:
            type: 'null'
          partiesTrouvees:
            maxItems: 0
          revelation:
            type: 'null'
    - if:
        properties:
          phase:
            const: EXTRAIT
      then:
        properties:
          lecture:
            type: object
          main:
            type: 'null'
          partiesTrouvees:
            maxItems: 1
          revelation:
            type: 'null'
    - if:
        properties:
          phase:
            const: PROPOSITION
      then:
        properties:
          lecture:
            type: object
            properties:
              etat:
                const: EN_PAUSE
          main:
            type: object
          partiesTrouvees:
            maxItems: 1
          revelation:
