    - passageId
    - numeroModification
    - numero
    - chanson
    - interpretes
    - etapeId
    - etat
    - prochainAppelPrevuLe
    - appeleLe
    - echeanceAppelLe
    - delaiAppelRestantMs
    - demarreLe
    - finPrevueLe
    - positionChronologiqueMs
    - tempsPauseMs
    - calculeLe
    - clotureLe
    description: 'Passage courant affiché : le courant actif (APPELE, EN_COURS ou EN_PAUSE), sinon le dernier Passage
      TERMINE ou SAUTE jusqu’au prochain appel. APPELE : délai restant max(0, échéance − calculeLe), figé en pause
      où l’échéance est nulle ; prochainAppelPrevuLe vaut l’échéance plus la durée d’inscription si le délai restant
      est positif hors pause, sinon null. EN_COURS : positionChronologiqueMs vaut min(durée de référence, calculeLe −
      demarreLe − tempsPauseMs) et prochainAppelPrevuLe vaut finPrevueLe. EN_PAUSE : position figée au début de la
      pause.'
    allOf:
    - if:
        properties:
          etat:
            const: APPELE
      then:
        properties:
          delaiAppelRestantMs:
            type: integer
          demarreLe:
            type: 'null'
          finPrevueLe:
            type: 'null'
          positionChronologiqueMs:
            type: 'null'
          clotureLe:
            type: 'null'
          tempsPauseMs:
            const: 0
    - if:
        properties:
          etat:
            const: EN_COURS
      then:
        properties:
          echeanceAppelLe:
            type: 'null'
          delaiAppelRestantMs:
            type: 'null'
          demarreLe:
            type: string
            format: date-time
            pattern: Z$
          finPrevueLe:
            type: string
            format: date-time
            pattern: Z$
          positionChronologiqueMs:
            type: integer
          clotureLe:
            type: 'null'
          prochainAppelPrevuLe:
            type: string
            format: date-time
            pattern: Z$
    - if:
        properties:
          etat:
            const: EN_PAUSE
      then:
        properties:
          echeanceAppelLe:
            type: 'null'
          delaiAppelRestantMs:
            type: 'null'
          demarreLe:
            type: string
            format: date-time
            pattern: Z$
          finPrevueLe:
            type: 'null'
          positionChronologiqueMs:
            type: integer
          clotureLe:
            type: 'null'
          prochainAppelPrevuLe:
            type: 'null'
    - if:
        properties:
          etat:
            const: TERMINE
      then:
        properties:
          echeanceAppelLe:
            type: 'null'
          delaiAppelRestantMs:
            type: 'null'
          demarreLe:
            type: string
            format: date-time
            pattern: Z$
          finPrevueLe:
            type: 'null'
          positionChronologiqueMs:
            type: 'null'
          clotureLe:
            type: string
            format: date-time
            pattern: Z$
          prochainAppelPrevuLe:
            type: 'null'
    - if:
        properties:
          etat:
            const: SAUTE
      then:
        properties:
          echeanceAppelLe:
            type: 'null'
          delaiAppelRestantMs:
            type: 'null'
          finPrevueLe:
            type: 'null'
          positionChronologiqueMs:
            type: 'null'
