          origineParoles:
            const: REPLI_INSCRIPTION
      then:
        anyOf:
        - properties:
            source:
              const: FICHIER_LOCAL
        - properties:
            motifParolesSeules:
              const: ERREUR_LECTURE
    - if:
        anyOf:
        - properties:
            etat:
              const: EN_ERREUR
        - required:
          - demandePosition
          properties:
            demandePosition:
              type: object
      then:
        properties:
          source:
            const: FICHIER_LOCAL
  LigneParoles:
    type: object
    additionalProperties: false
    properties:
      positionMs:
        type: integer
        minimum: 0
        maximum: 9007199254740991
      texte:
        type: string
        description: Texte de la ligne, vide permis.
    required:
    - positionMs
    - texte
  ParolesDuPassage:
    type: object
    additionalProperties: false
    properties:
      parolesId:
        type: string
        format: uuid
        description: Identifiant opaque de la version retenue, sans identifiant de fournisseur.
      dureeMs:
        type: integer
        minimum: 1
        maximum: 9007199254740991
      lignes:
        type: array
        items:
          $ref: '#/$defs/LigneParoles'
        contains:
          properties:
            texte:
              pattern: \S
        description: Lignes dans l’ordre source, dont au moins une non blanche.
    required:
    - parolesId
    - dureeMs
    - lignes
  LigneVictoiresFreestyle:
    type: object
    additionalProperties: false
    description: Interprète d’au moins un Passage à plusieurs clos. Une victoire revient à chaque Interprète qui a
      reçu le plus de voix d’un Passage, égalité comprise ; un Passage sans voix n’en donne aucune. Rang nul sans
      victoire.
    properties:
      rang: { type: [integer, 'null'], minimum: 1 }
      interprete:
        $ref: '#/$defs/InterpretePublic'
      nombreVictoires: { type: integer, minimum: 0 }
      nombrePassages: { type: integer, minimum: 1 }
    required: [rang, interprete, nombreVictoires, nombrePassages]
  LignePalmaresFreestyle:
    type: object
    additionalProperties: false
    description: Passage à un seul Interprète, classé par la moyenne exacte de ses notes.
    properties:
      passageId: { type: string, format: uuid }
      numero: { type: integer, minimum: 1, maximum: 9007199254740991 }
      rang: { type: [integer, 'null'], minimum: 1 }
      instrumentale:
        $ref: '#/$defs/Instrumentale'
      interprete:
        $ref: '#/$defs/InterpretePublic'
      nombreVotes: { type: integer, minimum: 0 }
      moyenneDixiemes: { type: [integer, 'null'], minimum: 10, maximum: 50 }
    required: [passageId, numero, rang, instrumentale, interprete, nombreVotes, moyenneDixiemes]
  IdentifiantInstrumentale:
    type: string
    format: uuid
    description: Identifiant opaque attribué par l’Écran de salle, stable tant que le fichier et sa fiche sont inchangés.
  Instrumentale:
    type: object
    additionalProperties: false
    properties:
      instrumentaleId:
        $ref: '#/$defs/IdentifiantInstrumentale'
      titre:
        type: string
        minLength: 1
        maxLength: 120
        pattern: '\S'
      tempoBpm:
        type: integer
        minimum: 1
        maximum: 1000
      departBeatMs:
        type: integer
        minimum: 0
        maximum: 9007199254740991
      dureeMs:
        type: integer
        minimum: 1
        maximum: 9007199254740991
        description: Durée du fichier mesurée par l’Écran de salle. Une Grille ne doit pas finir après elle.
    required: [instrumentaleId, titre, tempoBpm, departBeatMs, dureeMs]
  InstrumentalesDisponibles:
    type: object
    additionalProperties: false
    properties:
      instrumentales:
        type: array
        uniqueItems: true
        description: Les identifiants sont uniques dans la liste. Une liste vide retire la disponibilité de toutes les fiches.
        items:
          $ref: '#/$defs/Instrumentale'
    required: [instrumentales]
  DeclarationInstrumentales:
    type: object
    additionalProperties: false
    properties:
      lecteurId:
        type: string
        format: uuid
        description: Fenêtre d’Écran de salle qui déclare son dossier. Elle devient le lecteur désigné du Freestyle dans la Soirée.
      instrumentales:
        type: array
        uniqueItems: true
        description: Les identifiants sont uniques dans la liste. Une liste vide retire la disponibilité de toutes les fiches.
        items:
          $ref: '#/$defs/Instrumentale'
    required: [lecteurId, instrumentales]
  DifficulteFreestyle:
    type: string
    enum: [TOUS, PREMIER, DERNIER, AUCUN]
    description: Visibilité des mots de chaque famille de rimes, sur l’ensemble de la Grille.
  NombreMesuresFreestyle:
    type: integer
    enum: [8, 16, 32]
  MesuresParCoupletFreestyle:
    type: integer
    enum: [2, 4, 8]
    description: Longueur d’un Couplet en mesures (#74). nombreMesures doit en être un multiple.
  ReglagesFreestyle:
    type: object
    additionalProperties: false
    properties:
      theme:
        type: string
        enum: [SOIREE, VILLE, SPORT]
        description: Thème de départ fourni par le dictionnaire de rimes (#69).
      schemaDeRimes:
        type: string
        enum: [AABB, ABAB, AAAA]
      difficulte:
        $ref: '#/$defs/DifficulteFreestyle'
      nombreMesures:
        $ref: '#/$defs/NombreMesuresFreestyle'
      mesuresParCouplet:
        $ref: '#/$defs/MesuresParCoupletFreestyle'
        description: Facultatif à la création, 4 par défaut ; toujours présent une fois la Manche créée.
      instrumentaleIds:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          $ref: '#/$defs/IdentifiantInstrumentale'
    required: [theme, schemaDeRimes, difficulte, nombreMesures, instrumentaleIds]
  InscriptionFreestyle:
    type: object
    additionalProperties: false
    properties:
      envoiId:
        type: string
        format: uuid
      instrumentaleId:
        oneOf:
        - $ref: '#/$defs/IdentifiantInstrumentale'
        - type: 'null'
        description: Null pour tirer au hasard parmi les Instrumentales sélectionnées, disponibles et admissibles pour le Joueur.
      invitesIds:
        type: array
        maxItems: 3
        uniqueItems: true
        description: Facultatif, comme au Karaoké (#66) ; au plus quatre Interprètes avec l’inscripteur.
        items:
          type: string
          format: uuid
    required: [envoiId, instrumentaleId]
  InscriptionSelonMode:
    oneOf:
    - $ref: '#/$defs/InscriptionPassage'
    - $ref: '#/$defs/InscriptionFreestyle'
  MotDeGrilleFreestyle:
    type: object
    additionalProperties: false
    properties:
      mesure:
        type: integer
        minimum: 1
        maximum: 32
      temps:
        type: integer
        const: 3
      positionMs:
        type: integer
        minimum: 0
        maximum: 9007199254740991
        description: Position depuis le début du fichier audio, arrondie à la milliseconde la plus proche.
      famille:
        type: string
        enum: [A, B]
      mot:
        type: [string, 'null']
        minLength: 1
        description: Null quand la difficulté masque le mot sur la salle et la Manette.
    required: [mesure, temps, positionMs, famille, mot]
  GrilleFreestyle:
    type: object
    additionalProperties: false
    properties:
      nombreMesures:
        $ref: '#/$defs/NombreMesuresFreestyle'
      mots:
        type: array
        description: Un mot par mesure à quatre temps, au troisième temps. Le schéma de rimes se répète toutes les quatre mesures.
        items:
          $ref: '#/$defs/MotDeGrilleFreestyle'
    required: [nombreMesures, mots]
    allOf:
    - if:
        properties:
          nombreMesures: { const: 8 }
      then:
        properties:
          mots: { minItems: 8, maxItems: 8 }
    - if:
        properties:
          nombreMesures: { const: 16 }
      then:
        properties:
          mots: { minItems: 16, maxItems: 16 }
    - if:
        properties:
          nombreMesures: { const: 32 }
      then:
        properties:
          mots: { minItems: 32, maxItems: 32 }
  PassageFreestyle:
    type: object
    properties:
      passageId:
        type: string
        format: uuid
      numeroModification:
        type: integer
        minimum: 0
      numero:
        type: integer
        minimum: 1
      instrumentale:
        $ref: '#/$defs/Instrumentale'
      interpretes:
        type: array
        minItems: 1
        maxItems: 4
        description: Interprètes acceptés, l’inscripteur en premier.
        items:
          $ref: '#/$defs/InterpretePublic'
    required: [passageId, numeroModification, numero, instrumentale, interpretes]
  PassageFreestyleEnAttente:
    allOf:
    - $ref: '#/$defs/PassageFreestyle'
    - type: object
      properties:
        position:
          type: integer
          minimum: 1
      required: [position]
    unevaluatedProperties: false
  CourantFreestyle:
    allOf:
    - $ref: '#/$defs/PassageFreestyle'
    - type: object
      properties:
        etapeId:
          type: string
          format: uuid
        etat:
          type: string
          enum: [APPELE, EN_COURS, EN_PAUSE, TERMINE, SAUTE]
        delaiAppelRestantMs:
          type: [integer, 'null']
          minimum: 0
        demarreLe:
          type: [string, 'null']
          format: date-time
        finPrevueLe:
          type: [string, 'null']
          format: date-time
        positionChronologiqueMs:
          type: [integer, 'null']
          minimum: 0
          description: Chronologie serveur, utile notamment à la reprise de la lecture. La position du lecteur local cadence la Grille.
        calculeLe:
          type: string
          format: date-time
        couplets:
          oneOf:
          - $ref: '#/$defs/CoupletsFreestyle'
          - type: 'null'
          description: Null pour un Passage à un seul Interprète, et avant « Je suis prêt ».
      required: [etapeId, etat, delaiAppelRestantMs, demarreLe, finPrevueLe, positionChronologiqueMs, calculeLe, couplets]
    unevaluatedProperties: false
  CoupletFreestyle:
    type: object
    additionalProperties: false
    properties:
      numero:
        type: integer
        minimum: 1
        maximum: 16
      interprete:
        $ref: '#/$defs/InterpretePublic'
      premiereMesure:
        type: integer
        minimum: 1
        maximum: 32
      derniereMesure:
        type: integer
        minimum: 2
        maximum: 32
    required: [numero, interprete, premiereMesure, derniereMesure]
  CoupletsFreestyle:
    type: object
    additionalProperties: false
    description: Couplets d’un Passage à plusieurs (#74). L’ordre des Interprètes est tiré au sort par le serveur à
      « Je suis prêt », identique sur toutes les destinations, puis répété tant que la Grille compte des Couplets.
      suivantAnnonce passe à true une mesure avant le changement (couplet-annonce), puis courant avance au
      changement (couplet-commence).
    properties:
      mesuresParCouplet:
        $ref: '#/$defs/MesuresParCoupletFreestyle'
      nombreCouplets:
        type: integer
        minimum: 1
        maximum: 16
      ordre:
        type: array
        minItems: 2
        maxItems: 4
        items:
          $ref: '#/$defs/InterpretePublic'
      courant:
        $ref: '#/$defs/CoupletFreestyle'
      suivant:
        oneOf:
        - $ref: '#/$defs/CoupletFreestyle'
        - type: 'null'
      suivantAnnonce:
        type: boolean
    required: [mesuresParCouplet, nombreCouplets, ordre, courant, suivant, suivantAnnonce]
  CycleVoteFreestyle:
    type: object
    properties:
      etat:
        type: string
        enum: [OUVERT, CLOS]
      delaiRestantMs:
        type: integer
        minimum: 0
      calculeLe:
        type: string
        format: date-time
      clotureLe:
        type: [string, 'null']
        format: date-time
    required: [etat, delaiRestantMs, calculeLe, clotureLe]
  ScrutinFreestyle:
    type: string
    enum: [NOTE, MEILLEUR_INTERPRETE]
    description: NOTE pour un Passage à un seul Interprète, MEILLEUR_INTERPRETE pour un Passage à plusieurs (#74).
  VoixInterpreteFreestyle:
    type: object
    additionalProperties: false
    properties:
      interprete:
        $ref: '#/$defs/InterpretePublic'
      nombreVoix:
        type: integer
        minimum: 0
    required: [interprete, nombreVoix]
  VoteFreestylePublic:
    allOf:
    - $ref: '#/$defs/PassageFreestyle'
    - $ref: '#/$defs/CycleVoteFreestyle'
    - type: object
      properties:
        scrutin:
          $ref: '#/$defs/ScrutinFreestyle'
        nombreVotes:
          type: integer
          minimum: 0
        voix:
          type: [array, 'null']
          description: Voix de chaque Interprète, dans l’ordre des Interprètes, une fois le vote clos d’un Passage à
            plusieurs ; null sinon.
          items:
            $ref: '#/$defs/VoixInterpreteFreestyle'
      required: [scrutin, nombreVotes, voix]
    unevaluatedProperties: false
  VoteFreestyleManette:
    allOf:
    - $ref: '#/$defs/PassageFreestyle'
    - $ref: '#/$defs/CycleVoteFreestyle'
    - type: object
      properties:
        scrutin:
          $ref: '#/$defs/ScrutinFreestyle'
        maNote:
          type: [integer, 'null']
          minimum: 1
          maximum: 5
          description: Toujours null pour le scrutin MEILLEUR_INTERPRETE.
        monChoix:
          type: [string, 'null']
          format: uuid
          description: Interprète désigné par ce Joueur ; toujours null pour le scrutin NOTE.
        peutVoter:
          type: boolean
      required: [scrutin, maNote, monChoix, peutVoter]
    unevaluatedProperties: false
  InvitationRecueFreestyle:
    type: object
    additionalProperties: false
    description: Invitation en suspens adressée au seul Joueur de la Manette, avec l’Instrumentale et l’inscripteur.
      passage porte le compteur à renvoyer avec ACCEPTER ou REFUSER.
    properties:
      passage:
        $ref: '#/$defs/CiblePassage'
      numero:
        type: integer
        minimum: 1
        maximum: 9007199254740991
      instrumentale:
        $ref: '#/$defs/Instrumentale'
      inscrivant:
        $ref: '#/$defs/InterpretePublic'
      interpretes:
        type: array
        items:
          $ref: '#/$defs/InterpretePublic'
        minItems: 1
        maxItems: 3
    required: [passage, numero, instrumentale, inscrivant, interpretes]
  FreestyleCommun:
    type: object
    properties:
      mancheId:
        type: string
        format: uuid
      etat:
        type: string
        enum: [EN_COURS, EN_PAUSE]
      difficulte:
        $ref: '#/$defs/DifficulteFreestyle'
      courant:
        oneOf:
        - $ref: '#/$defs/CourantFreestyle'
        - type: 'null'
      grille:
        oneOf:
        - $ref: '#/$defs/GrilleFreestyle'
        - type: 'null'
      passagesEnAttente:
        type: array
        items:
          $ref: '#/$defs/PassageFreestyleEnAttente'
      nombreEnAttente:
        type: integer
        minimum: 0
      limitePassagesEnAttente:
        type: integer
        minimum: 1
        maximum: 20
      tourOuvert:
        type: integer
        minimum: 1
      passagePrioritaireId:
        type: [string, 'null']
        format: uuid
    required: [mancheId, etat, difficulte, courant, grille, passagesEnAttente, nombreEnAttente, limitePassagesEnAttente, tourOuvert, passagePrioritaireId]
    if:
      properties:
        courant:
          type: object
          properties:
            etat:
              enum: [EN_COURS, EN_PAUSE]
      required: [courant]
    then:
      properties:
        grille:
          $ref: '#/$defs/GrilleFreestyle'
    else:
      properties:
        grille:
          type: 'null'
  GrilleFreestylePublique:
    allOf:
    - $ref: '#/$defs/FreestyleCommun'
    - properties:
        passagesEnAttente:
          maxItems: 3
    - if:
        properties:
          difficulte: { const: AUCUN }
      then:
        properties:
          grille:
            properties:
              mots:
                items:
                  properties:
                    mot: { type: 'null' }
    - if:
        properties:
          difficulte: { const: TOUS }
      then:
        properties:
          grille:
            properties:
              mots:
                items:
                  properties:
                    mot: { type: string }
  BlocFreestyleSalle:
    allOf:
    - $ref: '#/$defs/GrilleFreestylePublique'
    - type: object
      properties:
        lecteurDesigneId:
          oneOf:
          - type: string
            format: uuid
          - type: 'null'
          description: Fenêtre d’Écran de salle qui a déclaré la dernière les Instrumentales de la Soirée, sinon null. Seule elle joue l’Instrumentale ; les autres affichent la Grille.
        votes:
          type: array
          items:
            $ref: '#/$defs/VoteFreestylePublic'
      required: [lecteurDesigneId, votes]
    unevaluatedProperties: false
  BlocFreestyleConsole:
    allOf:
    - $ref: '#/$defs/FreestyleCommun'
    - type: object
      properties:
        grille:
          properties:
            mots:
              items:
                properties:
                  mot: { type: string }
        instrumentales:
          type: array
          items:
            $ref: '#/$defs/Instrumentale'
          description: Fiches disponibles pour la Soirée.
        peutGererFile:
          type: boolean
          description: Vrai quand l’Animateur peut retirer un Passage en attente.
        peutAppeler:
          type: boolean
        peutPasser:
          type: boolean
        invitationsEnAttente:
          type: array
          items:
            $ref: '#/$defs/InvitationEnAttente'
        votes:
          type: array
          items:
            $ref: '#/$defs/VoteFreestylePublic'
      required: [instrumentales, peutGererFile, peutAppeler, peutPasser, invitationsEnAttente, votes]
    unevaluatedProperties: false
  BlocFreestyleManette:
    allOf:
    - $ref: '#/$defs/GrilleFreestylePublique'
    - type: object
      properties:
        instrumentales:
          type: array
          items:
            $ref: '#/$defs/Instrumentale'
          description: Fiches sélectionnées et disponibles dans cette Manche.
        mesPassagesEnAttente:
          type: array
          items:
            $ref: '#/$defs/PassageFreestyleEnAttente'
        invitationsEmises:
          type: array
          items:
            $ref: '#/$defs/InvitationEmise'
        invitationsRecues:
          type: array
          items:
            $ref: '#/$defs/InvitationRecueFreestyle'
        peutInscrire:
          type: boolean
        peutConfirmerPresence:
          type: boolean
        monCoupletAnnonce:
          type: boolean
          description: true seulement sur la Manette de l’Interprète annoncé, entre couplet-annonce et
            couplet-commence. La Manette vibre à l’événement couplet-annonce, jamais sur une capture.
        votes:
          type: array
          items:
            $ref: '#/$defs/VoteFreestyleManette'
      required: [instrumentales, mesPassagesEnAttente, invitationsEmises, invitationsRecues, peutInscrire,
        peutConfirmerPresence, monCoupletAnnonce, votes]
    unevaluatedProperties: false

  ImageJpeg:
    type: string
    format: binary
    description: Octets JPEG bruts. Les exemples YAML représentent ces octets en base64.
  AccusePhoto:
    type: object
    additionalProperties: false
    required: [envoiId, soireeId, photoId]
    properties:
      envoiId:
        type: string
        format: uuid
      soireeId:
        type: string
        format: uuid
      photoId:
        type: string
        format: uuid
  ModerationPhoto:
    type: object
    additionalProperties: false
    required: [acceptee]
    properties:
      acceptee:
        type: boolean
  ReglagesPhotos:
    type: object
    additionalProperties: false
    required: [ouvertes]
    properties:
      ouvertes:
        type: boolean
  PhotoEnAttente:
    type: object
    additionalProperties: false
    required: [photoId, pseudo]
    properties:
      photoId:
        type: string
        format: uuid
      pseudo:
        type: string
        minLength: 1
  BlocPhotosConsole:
    type: object
    additionalProperties: false
    required: [ouvertes, enAttente]
    properties:
      ouvertes:
        type: boolean
      enAttente:
        type: array
        maxItems: 30
        items:
          $ref: '#/$defs/PhotoEnAttente'
  PhotoAfficheeOuVide:
    oneOf:
    - type: 'null'
    - type: object
      additionalProperties: false
      required: [photoId, echeance]
      properties:
        photoId:
          type: string
          format: uuid
        echeance:
          type: string
          format: date-time
