description: "Toutes les données sont fictives. Contrat seul : aucun serveur exécuté. Délégation (#67) :
  l’Animateur confie FILE_ATTENTE et PHOTOS à Alizé, qui appelle puis passe un Passage depuis sa Manette ;
  l’Animateur, resté sur sa vue d’avant, voit sa commande refusée comme périmée. Alizé modère une photo,
  puis l’Animateur retire la Délégation et la commande suivante d’Alizé est refusée. Deux pilotes :
  l’Animateur (session) et Alizé (jeton de Joueur). Basile n’en voit rien. Révisions de départ :
  Console 10, Manette d’Alizé 20, Manette de Basile 30."
