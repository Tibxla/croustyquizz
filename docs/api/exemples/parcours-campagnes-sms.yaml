parametresCommuns:
  X-CSRF-TOKEN: jeton-csrf-d-exemple
  campagneId: &campagneId 33000000-0000-4000-8000-000000000002
http:
- nom: L’Animateur prévisualise sa Campagne le dimanche
  operationId: previsualiserCampagneSms
  requete: &message { texte: 'Retrouve-nous jeudi pour le Quiz !' }
  statut: 200
  reponse:
    exemple: |-
      Retrouve-nous jeudi pour le Quiz !
      STOP : https://croustyquizz.invalid/stop/exemple
    destinataires: 2
    segments: 1
    coutEstimeCentimes: 10
    envoiPrevuLe: &envoiPrevu '2026-11-30T07:00:00Z'
    immediat: false
- nom: L’Animateur programme la Campagne
  operationId: creerCampagneSms
  parametres: { Idempotency-Key: 33000000-0000-4000-8000-000000000001 }
  requete: *message
  statut: 201
  reponse: &programmee
    id: *campagneId
    texte: 'Retrouve-nous jeudi pour le Quiz !'
    demandeeLe: '2026-11-29T10:00:00Z'
    envoiPrevuLe: *envoiPrevu
    etat: PROGRAMMEE
    envoyes: 0
    echoues: 0
- nom: La liste reflète l’état des envois après le créneau
  operationId: listerCampagnesSms
  statut: 200
  reponse:
    destinatairesEligibles: 2
    campagnes:
    - &terminee
      <<: *programmee
      etat: TERMINEE
      envoyes: 1
      echoues: 1
- nom: La répétition de la demande renvoie la même Campagne avec son état courant
  operationId: creerCampagneSms
  parametres: { Idempotency-Key: 33000000-0000-4000-8000-000000000001 }
  requete: *message
  statut: 200
  reponse: *terminee
- nom: L’Animateur réutilise la clé pour un autre texte
  operationId: creerCampagneSms
  parametres: { Idempotency-Key: 33000000-0000-4000-8000-000000000001 }
  requete: { texte: 'Le Quiz est demain.' }
  statut: 409
  reponse:
    type: about:blank
    title: Conflit
    status: 409
    code: CLE_IDEMPOTENCE_REUTILISEE
    detail: Cette demande correspond à un autre texte.
    instance: /api/campagnes-sms
- nom: Le détail donne les résultats des envois
  operationId: consulterCampagneSms
  statut: 200
  reponse:
    campagne: *terminee
    envois:
    - &envoye
      contactId: 33000000-0000-4000-8000-000000000003
      statut: ENVOYE
      envoyeLe: *envoiPrevu
      motif: null
      identifiantPrestataire: simulation-33000000-0000-4000-8000-000000000005
    - contactId: 33000000-0000-4000-8000-000000000004
      statut: ECHOUE
      envoyeLe: *envoiPrevu
      motif: Échec de l’envoi.
      identifiantPrestataire: null
evenements: []
cases:
- nom: Un envoi ne révèle pas le lien personnel de désinscription
  schema: EnvoiCampagneSms
  valide: false
  valeur:
    <<: *envoye
    lienDeDesinscription: https://croustyquizz.invalid/stop/contact-fictif
- nom: Le succès d’un envoi exige un identifiant du prestataire
  schema: EnvoiCampagneSms
  valide: false
  valeur:
    <<: *envoye
    identifiantPrestataire: null
  correction: { chemin: [identifiantPrestataire], valeur: 'simulation-33000000-0000-4000-8000-000000000005' }

