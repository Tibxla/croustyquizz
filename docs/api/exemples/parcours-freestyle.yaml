      tempoBpm: 120
      departBeatMs: 250
      dureeMs: 95000
  statut: 200
  reponse:
    envoiId: *declaration
    soireeId: *soireeId
    recueLe: '2026-11-24T20:00:00Z'
- nom: Relire les fiches dans la Console
  operationId: consulterInstrumentales
  acteur: animateur
  statut: 200
