          positionChronologiqueMs: 0
          calculeLe: *depart
          couplets: null
        lecteurDesigneId: *lecteurId
        votes: []
        grille: &masquee
          nombreMesures: 8
          mots:
          - { mesure: 1, temps: 3, positionMs: 1250, famille: A, mot: lumière }
          - { mesure: 2, temps: 3, positionMs: 3250, famille: B, mot: nuit }
          - { mesure: 3, temps: 3, positionMs: 5250, famille: A, mot: null }
          - { mesure: 4, temps: 3, positionMs: 7250, famille: B, mot: null }
          - { mesure: 5, temps: 3, positionMs: 9250, famille: A, mot: null }
          - { mesure: 6, temps: 3, positionMs: 11250, famille: B, mot: null }
          - { mesure: 7, temps: 3, positionMs: 13250, famille: A, mot: null }
          - { mesure: 8, temps: 3, positionMs: 15250, famille: B, mot: null }
