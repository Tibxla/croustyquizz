description: Passage fictif en Pilotage Manuel sur une Instrumentale locale, avec Grille et Vote du public.
parametresCommuns:
  soireeId: &soireeId 70000000-0000-4000-8000-000000000001
  mancheId: &mancheId 70000000-0000-4000-8000-000000000002
  passageId: &passageId 70000000-0000-4000-8000-000000000003
  X-CSRF-TOKEN: csrf_session_freestyle_fictif_70
http:
- nom: Déclarer les fiches du dossier local
  operationId: declarerInstrumentales
  acteur: ecran
  parametres:
    Idempotency-Key: &declaration 70000000-0000-4000-8000-000000000010
