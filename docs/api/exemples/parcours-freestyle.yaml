- nom: Préparer une Manche de huit mesures
  operationId: ajouterManche
  acteur: animateur
  requete:
    mode: FREESTYLE
    reglages: &reglages
      theme: VILLE
      schemaDeRimes: ABAB
      difficulte: PREMIER
      nombreMesures: 8
      instrumentaleIds: [*instrumentaleId]
  statut: 201
  reponse:
    id: *mancheId
    ordre: 0
    mode: FREESTYLE
    etat: EN_ATTENTE
    reglages: *reglages
- nom: Refuser une Instrumentale absente de la sélection
  operationId: inscrirePassage
  requete:
    envoiId: 70000000-0000-4000-8000-000000000011
    instrumentaleId: 70000000-0000-4000-8000-000000000099
  statut: 422
  reponse:
    type: about:blank
    title: Inscription refusée
    status: 422
    code: INSTRUMENTALE_INDISPONIBLE
    detail: Cette Instrumentale n’est pas disponible dans la sélection.
    instance: /api/soirees/70000000-0000-4000-8000-000000000001/manches/70000000-0000-4000-8000-000000000002/passages
- nom: S’inscrire en laissant le choix au hasard
  operationId: inscrirePassage
