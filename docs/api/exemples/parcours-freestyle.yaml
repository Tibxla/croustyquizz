    soireeId: *soireeId
    mancheId: *mancheId
    passageId: *passageId
    numeroModification: 0
    action: INSCRIRE
    recueLe: '2026-11-24T20:00:02Z'
    etatApres: EN_ATTENTE
- nom: Appeler le Passage en tête
  operationId: appelerPassage
  acteur: animateur
  parametres:
    Idempotency-Key: &appel 70000000-0000-4000-8000-000000000013
  requete:
    numeroModification: 0
  statut: 200
