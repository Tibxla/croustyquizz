cases:
- nom: Inscription avec un choix explicite
  schema: InscriptionSelonMode
  valide: true
  valeur:
    envoiId: *inscription
    instrumentaleId: *instrumentaleId
- nom: Une fiche ne peut pas transporter de chemin local
  schema: Instrumentale
  valide: false
  valeur:
    instrumentaleId: *instrumentaleId
    titre: À la lueur
    tempoBpm: 120
    departBeatMs: 250
    dureeMs: 95000
    chemin: Instrumentales/À la lueur.mp3
- nom: Une fiche sans durée exploitable est refusée
  schema: Instrumentale
  valide: false
  valeur:
    instrumentaleId: *instrumentaleId
    titre: À la lueur
    tempoBpm: 120
    departBeatMs: 250
    dureeMs: 0
  correction:
    chemin: [dureeMs]
    valeur: 95000
- nom: Une déclaration désigne la fenêtre qui l’envoie par son UUID
  schema: DeclarationInstrumentales
  valide: false
  valeur:
    lecteurId: Écran du bar
    instrumentales: *instrumentales
  correction:
    chemin: [lecteurId]
    valeur: *lecteurId
- nom: Configuration Freestyle refusée avec neuf mesures
  schema: CreationManche
  valide: false
  valeur:
    mode: FREESTYLE
    reglages:
      theme: VILLE
      schemaDeRimes: ABAB
      difficulte: PREMIER
      nombreMesures: 9
      instrumentaleIds: [*instrumentaleId]
  correction:
    chemin: [reglages, nombreMesures]
    valeur: 8
- nom: La Salle refuse tous les mots transmis sous AUCUN
  schema: BlocFreestyleSalle
  valide: false
  valeur:
    mancheId: *mancheId
    etat: EN_COURS
    difficulte: AUCUN
    nombreEnAttente: 0
    limitePassagesEnAttente: 1
    tourOuvert: 1
    passagePrioritaireId: null
    passagesEnAttente: []
    courant: *courant
    grille: *complete
    lecteurDesigneId: null
    votes: []
  correction:
    chemin: [difficulte]
    valeur: TOUS
