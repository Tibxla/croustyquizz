  operationId: piloterSoiree
  acteur: animateur
  parametres:
    Idempotency-Key: 12000000-0000-4000-8000-000000000010
  requete: &lancer {action: LANCER}
  statut: 409
  reponse:
    type: about:blank
    title: Commande refusée
    status: 409
    code: PROGRAMME_INCOMPLET
    detail: Ajoute une Manche au programme avant de lancer la Soirée.
    instance: /api/soirees/12000000-0000-4000-8000-000000000001/commandes
- nom: Lancer après avoir préparé et ordonné les deux Manches
  operationId: piloterSoiree
  acteur: animateur
  parametres: &cleLancement
    Idempotency-Key: 12000000-0000-4000-8000-000000000011
  requete: *lancer
  statut: 200
  reponse: &accuseLancement
    envoiId: 12000000-0000-4000-8000-000000000011
