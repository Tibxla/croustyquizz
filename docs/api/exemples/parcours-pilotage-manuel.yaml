- nom: Terminer la Soirée pendant la deuxième Manche
  operationId: piloterSoiree
  acteur: animateur
  parametres:
    Idempotency-Key: 12000000-0000-4000-8000-000000000014
  requete: {action: TERMINER}
  statut: 200
  reponse:
    envoiId: 12000000-0000-4000-8000-000000000014
    recueLe: '2026-11-24T20:01:15Z'
    soireeId: 12000000-0000-4000-8000-000000000001
