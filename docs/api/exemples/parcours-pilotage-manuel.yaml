    soireeId: 12000000-0000-4000-8000-000000000001
- nom: Refuser la suivante pendant la première Manche
  operationId: piloterSoiree
  acteur: animateur
  parametres:
    Idempotency-Key: 12000000-0000-4000-8000-000000000012
  requete: &suivante {action: MANCHE_SUIVANTE}
