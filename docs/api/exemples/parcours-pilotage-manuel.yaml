  reponse:
    type: about:blank
    title: Commande refusée
    status: 409
    code: ETAT_INCOMPATIBLE
    detail: Termine la Manche active avant de passer à la suivante.
    instance: /api/soirees/12000000-0000-4000-8000-000000000001/commandes
- nom: Rejouer le lancement et retrouver le reçu initial
  operationId: piloterSoiree
  acteur: animateur
  parametres: *cleLancement
  requete: *lancer
  statut: 200
  reponse: *accuseLancement
- nom: Démarrer la suivante après la fin de la première Manche
  operationId: piloterSoiree
  acteur: animateur
  parametres:
    Idempotency-Key: 12000000-0000-4000-8000-000000000013
  requete: *suivante
  statut: 200
  reponse:
    envoiId: 12000000-0000-4000-8000-000000000013
    recueLe: '2026-11-24T20:01:05Z'
