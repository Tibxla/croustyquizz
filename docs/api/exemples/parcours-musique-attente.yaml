description: Hors Manche, l’Écran de salle signale son dossier et son état sonore, et l’Animateur coupe la Musique d’attente.
parametresCommuns:
  soireeId: &soireeId 14100000-0000-4000-8000-000000000001
http:
- nom: Signaler un dossier sans morceau dans Attente
  operationId: signalerDisponibiliteMusiqueDAttente
  acteur: ecran
  requete: &disponibilite { morceauxDisponibles: false }
  statut: 200
  reponse: *disponibilite
- nom: Couper la Musique d’attente
  operationId: reglerMusiqueDAttente
  acteur: animateur
  parametres: &csrf { X-CSRF-TOKEN: exemple-csrf-fictif }
  requete: &coupure { etat: COUPEE }
  statut: 200
  reponse: *coupure
- nom: Confirmer une coupure déjà appliquée sans nouvel événement
  operationId: reglerMusiqueDAttente
  acteur: animateur
  parametres: *csrf
  requete: *coupure
  statut: 200
  reponse: *coupure
- nom: Signaler le son coupé au chargement
  operationId: signalerSonEcran
  acteur: ecran
  requete: &sonCoupe { abonnementId: &abonnementEcran 14100000-0000-4000-8000-000000000002, sonActive: false }
  statut: 200
  reponse: *sonCoupe
- nom: Signaler l’activation du son
  operationId: signalerSonEcran
  acteur: ecran
  requete: &sonActive { abonnementId: *abonnementEcran, sonActive: true }
  statut: 200
  reponse: *sonActive
- nom: Refuser le signal d’un Écran déconnecté
  operationId: signalerSonEcran
  acteur: ecran
  requete: *sonActive
  statut: 409
  reponse:
    type: about:blank
    title: Commande refusée
    status: 409
    code: ABONNEMENT_INACTIF
    detail: L’abonnement de l’Écran de salle n’est plus actif.
    instance: /api/soirees/14100000-0000-4000-8000-000000000001/son-ecran
evenements:
- nom: Actualiser la Console après le signal du dossier
  canal: console
  message:
    type: musique-attente-modifiee
    soireeId: *soireeId
    revision: 1
    emisLe: 2026-11-24T20:00:01.000Z
    donnees: &consoleInitiale
      soiree: &soiree
        id: *soireeId
        titre: Soirée fictive
        format: SOLO
        pilotage: MANUEL
        etat: OUVERTE
        codeAcces: D3M8AB
      musiqueAttente: { etat: JOUE, morceauxDisponibles: false }
      mancheActive: null
      modeEnCours: null
      joueurs: []
      classement: []
      dernierBuzz: null
      programme: []
- nom: Actualiser l’Écran de salle après la coupure
  canal: salle
  message: &coupureSalle
    type: musique-attente-modifiee
    soireeId: *soireeId
    revision: 2
    emisLe: 2026-11-24T20:00:02.000Z
    donnees: &salleCoupee
      soiree: *soiree
      musiqueAttente: { etat: COUPEE, morceauxDisponibles: false }
      mancheActive: null
      modeEnCours: null
      joueurs: []
      classement: []
      dernierBuzz: null
- nom: Prévenir la Console que le son est coupé
  canal: console
  message:
    type: son-ecran-modifie
    soireeId: *soireeId
    revision: 3
    emisLe: 2026-11-24T20:00:03.000Z
    donnees:
      <<: *consoleInitiale
      musiqueAttente: { etat: COUPEE, morceauxDisponibles: false }
      sonEcran: COUPE
- nom: Prévenir la Console que le son est activé
  canal: console
  message:
    type: son-ecran-modifie
    soireeId: *soireeId
    revision: 4
    emisLe: 2026-11-24T20:00:04.000Z
    donnees:
      <<: *consoleInitiale
      musiqueAttente: { etat: COUPEE, morceauxDisponibles: false }
      sonEcran: ACTIVE
- nom: Oublier le son quand l’Écran se déconnecte
  canal: console
  message:
    type: son-ecran-modifie
    soireeId: *soireeId
    revision: 5
    emisLe: 2026-11-24T20:00:05.000Z
    donnees:
      <<: *consoleInitiale
      musiqueAttente: { etat: COUPEE, morceauxDisponibles: false }
      sonEcran: ABSENT
resynchronisation:
  destination: /topic/soirees/14100000-0000-4000-8000-000000000001/salle
  routeEtat: /api/soirees/14100000-0000-4000-8000-000000000001/etat/salle
  typeEvenementFinal: musique-attente-modifiee
  etat:
    abonnementId: 14100000-0000-4000-8000-000000000002
    revision: 1
    heureServeur: 2026-11-24T20:00:01.500Z
    vue:
      soiree: *soiree
      musiqueAttente: { etat: JOUE, morceauxDisponibles: false }
      mancheActive: null
      modeEnCours: null
      joueurs: []
      classement: []
      dernierBuzz: null
  tampon: [*coupureSalle, *coupureSalle]
  revisionFinale: 2
  vueFinale: *salleCoupee
cases:
- nom: L’abonnement est requis pour signaler le son
  schema: SignalSonEcran
  valide: false
  valeur: { sonActive: true }
- nom: L’état du son est requis
  schema: SignalSonEcran
  valide: false
  valeur: { abonnementId: *abonnementEcran }
- nom: Un signal du son refuse les champs inconnus
  schema: SignalSonEcran
  valide: false
  valeur:
    <<: *sonActive
    morceauxDisponibles: true
- nom: L’état du son est un booléen JSON
  schema: SignalSonEcran
  valide: false
  valeur: { abonnementId: *abonnementEcran, sonActive: 'true' }
  correction: { chemin: [sonActive], valeur: true }
