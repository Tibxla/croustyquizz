name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  contrats-api:
    name: Contrats HTTP et événements STOMP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/api/package-lock.json
      - name: Installer les validateurs de contrats
        run: npm ci --prefix tools/api --ignore-scripts --no-fund --no-audit
      - name: Valider les contrats et tester la Vue synchronisée
        run: npm test --prefix tools/api

  build:
    name: Build et tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Construire et lancer les tests (PostgreSQL via Testcontainers)
        run: ./mvnw -B verify
      - name: Calculer les mesures et les badges
        run: python3 tools/mesures-qualite.py
      - name: Conserver les rapports de tests, couverture et qualité
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rapports-qualite-${{ github.sha }}
          path: |
            target/surefire-reports/
            target/site/
            target/pmd.xml
            target/qualite/
          if-no-files-found: error
      - name: Préparer les badges à publier
        uses: actions/upload-artifact@v7
        with:
          name: mesures-qualite
          path: target/qualite/
          if-no-files-found: error

  publier-mesures:
    name: Publier les badges mesurés
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publication-mesures-qualite
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: mesures-qualite
          path: ${{ runner.temp }}/mesures-qualite
      - name: Actualiser la branche des indicateurs
        shell: bash
        run: |
          destination="$RUNNER_TEMP/publication-mesures"
          if git ls-remote --exit-code --heads origin refs/heads/mesures-qualite; then
            git fetch origin refs/heads/mesures-qualite:refs/remotes/origin/mesures-qualite
            git worktree add --detach "$destination" origin/mesures-qualite
          else
            git worktree add --detach --no-checkout "$destination" HEAD
            git -C "$destination" switch --orphan mesures-qualite
          fi
          mkdir -p "$destination/$GITHUB_REF_NAME"
          cp -a "$RUNNER_TEMP/mesures-qualite/." "$destination/$GITHUB_REF_NAME/"
          git -C "$destination" config user.name 'github-actions[bot]'
          git -C "$destination" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$destination" add --intent-to-add -- "$GITHUB_REF_NAME"
          if ! git -C "$destination" diff --quiet -- "$GITHUB_REF_NAME"; then
            git -C "$destination" commit -m "ci: publier les mesures de $GITHUB_REF_NAME" -- "$GITHUB_REF_NAME"
            git -C "$destination" push origin HEAD:refs/heads/mesures-qualite
          fi

  commits:
    name: Format des commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Vérifier chaque commit de la PR
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # Même expression que .githooks/commit-msg
          FORMAT='^(feat|fix|test|refactor|docs|chore|ci|build)(\([a-z0-9-]+\))?!?: .+'
          refus=0
          while IFS= read -r ligne; do
            if ! printf '%s\n' "$ligne" | grep -Eq "$FORMAT"; then
              echo "::error::Commit hors format : $ligne"
              refus=1
            fi
          done < <(git log --no-merges --format=%s "$BASE..$HEAD")
          if [ "$refus" -ne 0 ]; then
            echo "Format attendu : type(scope): description. Voir CONTRIBUTING.md."
            exit 1
          fi
          echo "Tous les commits respectent le format."
