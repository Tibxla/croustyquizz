name: Livraison

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions: {}

jobs:
  verifier:
    name: Vérifier la livraison
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Récupérer les sources et les branches
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Vérifier le format du tag et sa présence sur main
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo '::error::Le tag doit suivre le format vX.Y.Z.'
            exit 1
          fi
          git merge-base --is-ancestor HEAD origin/main
      - name: Préparer Java et le cache Maven
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Construire et lancer les tests (PostgreSQL via Testcontainers)
        run: ./mvnw -B verify
      - name: Conserver le JAR exécutable pour la release
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: application
          path: |
            target/*.jar
            !target/*-plain.jar
          if-no-files-found: error

  publier-image:
    name: Publier l'image sur GHCR
    needs: verifier
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Récupérer les sources
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Préparer Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Se connecter à GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Définir les étiquettes de l'image
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/tibxla/croustyquizz
          # latest accompagne une version semver, jamais l'image main.
          flavor: latest=auto
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
      - name: Construire et publier l'image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  publier-release:
    name: Publier la GitHub Release
    needs: publier-image
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Récupérer le JAR vérifié
        uses: actions/download-artifact@v8
        with:
          name: application
          path: target/
      - name: Publier le JAR et les notes de version
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: target/*.jar
          fail_on_unmatched_files: true
          generate_release_notes: true
