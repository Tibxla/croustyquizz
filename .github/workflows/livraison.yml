name: Livraison

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions: {}

jobs:
  verifier:
    name: Vérifier la livraison
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Récupérer les sources et les branches
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Vérifier le format du tag et sa présence sur main
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo '::error::Le tag doit suivre le format vX.Y.Z.'
            exit 1
          fi
          git merge-base --is-ancestor HEAD origin/main
      - name: Préparer Java et le cache Maven
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Construire et lancer les tests (PostgreSQL via Testcontainers)
        run: ./mvnw -B verify
      - name: Conserver le JAR exécutable pour la release
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: application
          path: |
            target/*.jar
            !target/*-plain.jar
          if-no-files-found: error

  publier-image:
    name: Publier l'image sur GHCR
    needs: verifier
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Récupérer les sources
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Préparer Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Se connecter à GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Définir les étiquettes de l'image
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/tibxla/croustyquizz
          # latest accompagne une version semver, jamais l'image main.
          flavor: latest=auto
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
      - name: Construire et publier l'image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  publier-release:
    name: Publier la GitHub Release
    needs: publier-image
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Récupérer le JAR vérifié
        uses: actions/download-artifact@v4
        with:
          name: application
          path: target/
      - name: Publier le JAR et les notes de version
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: target/*.jar
          fail_on_unmatched_files: true
          generate_release_notes: true

  deployer-production:
    name: Déployer la production
    # Chaque livraison vX.Y.Z (tag vérifié présent sur main) part en production sur
    # Render (docs/deploiement.md, « Recette et production sur Render et Neon »).
    needs: publier-release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions: {}
    concurrency:
      group: deploiement-production
      cancel-in-progress: false
    steps:
      - name: Demander à Render de construire la version livrée
        env:
          CROCHET: ${{ secrets.RENDER_DEPLOY_HOOK_PRODUCTION }}
        run: |
          if [ -z "$CROCHET" ]; then
            echo "::warning::Secret RENDER_DEPLOY_HOOK_PRODUCTION absent : production non déployée."
            exit 0
          fi
          curl -fsS -X POST "$CROCHET&ref=$GITHUB_SHA" -o /dev/null
          echo "Déploiement de $GITHUB_REF_NAME demandé : https://croustyquizz-prod.onrender.com"
